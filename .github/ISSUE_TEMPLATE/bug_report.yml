name: Bug report
description: Something in the tools or the game behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rrt2-decomp version or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Original game edition
      options: [GOG Platinum, CD Platinum, CD Gold, CD original, Other]
  - type: dropdown
    id: original
    attributes:
      label: Does the original game behave the same way?
      options: [Not checked, "Yes (original bug)", "No (our bug)"]
