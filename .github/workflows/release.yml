name: Release

# Tags v*: build, then publish a GitHub Release with the CHANGELOG section as the body.
# Every push to main: the same builds as workflow artifacts (nightly-style dev builds).
# rt2-oracle (Unicorn, needs the original EXE) is never built here: only `-p rt2-game`.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled on the Apple Silicon runner (Intel runners are being retired).
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold clang libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev libasound2-dev pkg-config
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Label (tag version, or nightly-<commit>)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "LABEL=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "LABEL=nightly-${GITHUB_SHA::9}" >> "$GITHUB_ENV"
          fi
          echo "RRT2_GIT_COMMIT=${GITHUB_SHA::9}" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: cargo build --release --locked -p rt2-game --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: scripts/package-release.sh "${{ matrix.platform }}" "$LABEL" "target/${{ matrix.target }}/release" dist
      # Windows installer (Inno Setup, packaging/windows/rrt2.iss) from the folder staged for the
      # zip; on tags also the filled winget manifests (packaging/winget, docs/packaging.md).
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          scripts/package-windows-installer.sh "$LABEL" dist
          if [[ "$GITHUB_REF" == refs/tags/v* && "$LABEL" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            scripts/fill-winget.sh "$LABEL" "dist/rrt2-$LABEL-windows-x86_64-setup.exe" "dist/winget/$LABEL"
            (cd dist/winget && 7z a -tzip -bso0 "../rrt2-$LABEL-winget-manifests.zip" .)
          fi
      # macOS: RRT2.app (icon from the logo, ad-hoc signed, not notarized) inside a .dmg.
      - name: macOS app and dmg
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/package-macos-app.sh "${{ matrix.platform }}" "$LABEL" "target/${{ matrix.target }}/release" dist
      # AppImage (docs/packaging.md): same binary, appimagetool and runtime pinned by sha256.
      - name: AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate packaging/linux/io.github.pedryvo.rrt2.desktop
          appstreamcli validate --no-net packaging/linux/io.github.pedryvo.rrt2.metainfo.xml
          scripts/package-appimage.sh "$LABEL" "target/${{ matrix.target }}/release" dist
      - uses: actions/upload-artifact@v4
        with:
          name: rrt2-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  # Flatpak bundle built from source in the freedesktop SDK (packaging/flatpak, docs/packaging.md).
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Label and commit
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "LABEL=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "LABEL=nightly-${GITHUB_SHA::9}" >> "$GITHUB_ENV"
          fi
          sed -i "s/RRT2_GIT_COMMIT: \"\"/RRT2_GIT_COMMIT: \"${GITHUB_SHA::9}\"/" packaging/flatpak/io.github.pedryvo.rrt2.yml
          grep -q "RRT2_GIT_COMMIT: \"${GITHUB_SHA::9}\"" packaging/flatpak/io.github.pedryvo.rrt2.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: packaging/flatpak/io.github.pedryvo.rrt2.yml
          bundle: rrt2-${{ env.LABEL }}-x86_64.flatpak
          artifact-name: rrt2-flatpak
          cache: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          scripts/changelog-section.sh "$GITHUB_REF_NAME" > notes.md
          if [[ ! -s notes.md ]]; then echo "No CHANGELOG.md section for $GITHUB_REF_NAME" >&2; exit 1; fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
