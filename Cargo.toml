[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
license = "GPL-3.0-or-later"
repository = "https://github.com/pedryvo/rrt2-decomp"
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
rt2-formats = { path = "crates/rt2-formats" }
rt2-sim = { path = "crates/rt2-sim" }
rt2-audio = { path = "crates/rt2-audio" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
png = "0.17"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
