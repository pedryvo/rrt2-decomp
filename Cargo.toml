[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
rt2-formats = { path = "crates/rt2-formats" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
