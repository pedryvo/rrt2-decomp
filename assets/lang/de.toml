2596 = "Im Sandkastenmodus bauen Sie einfach und lassen Züge fahren, ohne Geld und Konkurrenz zu beachten. Im Grunde spielen Sie in einem großen Sandkasten und treten auf keiner Ebene gegen andere an."
2597 = "Beim einfachen Finanzmodell tritt die Bedeutung der Börse in den Hintergrund. Sie können Aktien Ihrer eigenen Gesellschaft kaufen oder verkaufen, aber keine andere Gesellschaft übernehmen und nicht übernommen werden."
2598 = "Beim fortgeschrittenen Finanzmodell sind Leerverkäufe und Aktienkäufe auf Kredit deaktiviert, aber alle anderen Aspekte der Börse (einschließlich Übernahmen, Investitionen in andere Gesellschaften usw.) sind aktiviert."
2599 = "Beim Experten-Finanzmodell sind alle Aspekte der Börse aktiviert (was zu ziemlich üblen Finanzmanövern führen kann - sagen Sie nicht, wir hätten Sie nicht gewarnt)."
2600 = "Beim einfachen Industriemodell ist die Wirtschaft stark vereinfacht. Jeder Bahnhof nimmt jede Fracht an (allerdings zu einem etwas niedrigeren Preis, wenn die Fracht nicht nachgefragt wird). Alle Industrien produzieren Fracht, auch wenn sie nicht ordnungsgemäß mit ihrem Industriebedarf versorgt werden."
2601 = "Beim fortgeschrittenen Industriemodell ist die Wirtschaft mäßig anspruchsvoll. Bahnhöfe nehmen weiterhin jede Fracht an, aber Fracht, die an einem Bahnhof nicht nachgefragt wird, bringt nur den halben Preis. Industrien produzieren nur dann Fracht, wenn sie ordnungsgemäß mit ihrem Industriebedarf (falls vorhanden) versorgt werden."
2602 = "Beim Experten-Industriemodell ist die Wirtschaft in vollem Gange. Bahnhöfe zahlen für nicht nachgefragte Fracht nur einen Hungerlohn. Das Preisniveau beeinflusst, welche Preise Bahnhöfe für Fracht zu zahlen bereit sind, selbst wenn sie sie nachfragen. Ihre Gesellschaft kann auch Industrien aufkaufen, die sie attraktiv findet."
2603 = "Erhöht oder senkt die Einnahmen, die von Menschen gesteuerte Gesellschaften (also Ihre Gesellschaft) für den Gütertransport erhalten. Bei geringeren Einnahmen je Ladung wird das Spiel deutlich schwerer."
2604 = "Erhöht oder senkt die Einnahmen, die computergesteuerte Gesellschaften für den Gütertransport erhalten. Bei geringeren Einnahmen je Ladung sind die Computergesellschaften weniger profitabel und insgesamt weniger bedrohlich."
