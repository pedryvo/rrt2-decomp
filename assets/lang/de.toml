2552 = "Der Ölstand dieses Zuges. Geht einem Zug das Öl aus, verdreifachen sich seine Wartungskosten. Zum Auffüllen muss er einen Bahnhof mit Ringlokschuppen passieren (aber nicht unbedingt dort halten)."
