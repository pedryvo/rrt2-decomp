2554 = "Der Wasserstand dieses Zuges. Geht einem Dampfzug das Wasser aus, kriecht er nur noch dahin. Zum Auffüllen muss er einen Bahnhof mit Wasserturm passieren (aber nicht unbedingt dort halten)."
2555 = "Eine Erhöhung des Reglers steigert die Geschwindigkeit der Lokomotive über die normale Nennleistung hinaus, mit großem Pannenrisiko. Klicken und ziehen, um die Reglereinstellung zu ändern."
