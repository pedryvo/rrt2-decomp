3408 = "Gleisnetzerweiterung"
3409 = "Dividendenausschüttung/Aktienrückkauf"
3410 = "%1 pro Tag"
3411 = "Pannenwahrscheinlichkeit pro Tag:  %1"
3412 = "Der Konkursrichter lässt Sie nur dann Konkurs anmelden, wenn Sie mindestens 2 volle Jahre in Folge Verlust gemacht haben."
3413 = "Die klassische Kampagne erfordert das installierte ursprüngliche Railroad Tycoon II. Bitte installieren Sie das ursprüngliche RT II und versuchen Sie es erneut."
3414 = "Wiederholen"
3420 = "Schnelles Tastaturscrollen"
3421 = "Mit den Pfeiltasten um einen größeren Betrag scrollen (Strg-Pfeiltasten scrollen um weniger, wenn dies aktiv ist)."
3422 = "Alternative Ziffernblock-Belegung"
3423 = "Eine alternative Belegung für den Ziffernblock verwenden. 8: nach oben scrollen, 2 oder 5: nach unten scrollen, 4: nach links scrollen, 6: nach rechts scrollen, 7 & 9: heraus-/hineinzoomen, 1 & 3: nach links/rechts drehen."
3424 = "Das Spiel wurde auf die Einstellungen für wenig Speicher zurückgesetzt, weil für die Einstellungen für viel Speicher nicht genug freier Speicher vorhanden war. Weitere Informationen zur Speichernutzung finden Sie in der Liesmich-Datei von Railroad Tycoon II."
3425 = "800x600-Bildschirm"
3426 = "Den Monitor auf die Auflösung 800x600 statt der üblichen 1024x768 einstellen."
3427 = "Wechsel auf die Auflösung 800x600 nicht möglich. Ihr Monitor oder Ihre Grafikkarte unterstützt diese Auflösung möglicherweise nicht."
3428 = "Wechsel auf die Auflösung 1024x768 nicht möglich. Ihr Monitor oder Ihre Grafikkarte unterstützt diese Auflösung möglicherweise nicht."
3429 = "Autoscroll-Modus"
3430 = "Diese Option stellt den 800x600-Bildschirm vergrößert dar und scrollt automatisch zu verschiedenen Bildschirmbereichen, wenn Sie die Maus bewegen."
3431 = "Für diese Option müssen Sie sich im 800x600-Modus befinden."
3432 = "Es steht nicht genug Speicher zur Verfügung, um die Nutzung von viel Speicher einzuschalten. Weitere Informationen zur Maximierung des freien Speichers finden Sie in der Liesmich-Datei von Railroad Tycoon II."
3433 = "Wechsel in ein 1024x768-Fenster nicht möglich. Ihr Monitor muss auf mindestens 1152 x 864 eingestellt sein, um in einem 1024x786-Fenster zu laufen."
3434 = "Wechsel in einen 8-Bit-Modus nicht möglich. Railroad Tycoon II muss im 16-Bit-Modus sein, um in einem Fenster zu laufen."
3435 = "Open Transport wurde nicht erkannt. Open Transport muss installiert und aktiv sein, um Netzwerkspiele zu spielen."
3436 = "Fehler beim Öffnen des Netzwerk-Endpunkts. Stellen Sie sicher, dass Open Transport korrekt installiert und konfiguriert ist."
3437 = "Fehler beim Öffnen der Internetdienste. Stellen Sie sicher, dass Open Transport korrekt installiert und konfiguriert ist."
3438 = "Fehler beim Öffnen der Appletalk-Namensdienste. Stellen Sie sicher, dass Open Transport korrekt installiert und konfiguriert ist."
3439 = "Fehler beim Initialisieren von Open Transport. Stellen Sie sicher, dass Open Transport korrekt installiert und konfiguriert ist."
3440 = "Zugereignisse und Chatnachrichten vorlesen"
3441 = "Wichtige Zug- und Chatnachrichten während des Spiels per Sprachsynthese vorlesen."
3442 = "Es existiert bereits eine Datei mit diesem Namen. Möchten Sie sie ersetzen?"

