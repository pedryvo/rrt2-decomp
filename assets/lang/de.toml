1456 = "Ames Oakes"
1457 = "Oakes war Kongressabgeordneter des Bundesstaates Massachusetts. Er wurde wegen seiner Rolle im Credit-Mobilier-Skandal um die Union Pacific Railroad verurteilt."
1458 = "Frederick Billings"
1459 = "Ein fähiger Leiter der Northern Pacific Railroad von 1875 bis 1881. Billings verlor die Kontrolle über die NPR an Henry Villard, der sie zwei Jahre später in den Konkurs trieb."
1460 = "Eugene V. Debs"
1461 = "Debs gründete 1893 die American Railway Union und war auch Gründer der Sozialistischen Partei der USA. Er war ein echter Antiheld in den Annalen der US-Eisenbahnen. Es könnte nützlich sein, ihn auf Ihrer Seite zu haben."
1462 = "John Work Garrett"
1463 = "Machte aus der schlecht geführten B&O Railroad Company ein Kraftwerk. Leitete die B&O 26 Jahre lang nach einer erfolgreichen Übernahme durch die Aktionäre im Jahr 1858."
1464 = "Robert Gerwig"
1465 = "Der deutsche Bauingenieur Gerwig leitete den Bau der Schwarzwaldbahn. Gerwig erwies sich als hervorragender Gleis- und Tunnelbauer."
1466 = "Daniel Gooch"
1467 = "Half als Superintendent der Great Western Railway 1845, die Breitspur in England einzuführen."
1468 = "Charles Melville Hays"
1469 = "Ein Amerikaner, der 1895 geholt wurde, um die kanadische Grand Trunk Railway neu zu organisieren. Hays war für seine rücksichtslose Effizienz bekannt."
1470 = "Johns Hopkins"
1471 = "Hopkins, ein erfolgreicher Kaufmann in Baltimore, blieb als Philanthrop in Erinnerung. Er rettete 1847 auch die B&O-Eisenbahn."
1472 = "Theodore D. Judah"
1473 = "'Der verrückte Ted Judah' war ein Visionär der Eisenbahn. Judah, der sich für die transkontinentale Eisenbahn einsetzte, hatte eine Vereinbarung zum Kauf der Central Pacific Railroad; auf der Reise von Nicaragua nach New York, um den Handel abzuschließen, erkrankte Judah jedoch an Gelbfieber und starb."
1474 = "Charles F. Mayer"
1475 = "Mayer neigte beim Führen von Eisenbahnen zur Expansion. Zum Glück war er darin auch gut."
1476 = "Oscar G. Murray"
1477 = "Murray galt als einer der besten Verkehrsleiter seiner Zeit. Leitete die B&O Railroad von 1904 bis 1910."
1478 = "George Nagelmachers"
1479 = "Eine belgische Version von George Pullman. Gründete die Compagnie des Wagons-Lits und schuf Personenwagen, die in ganz Europa verwendet wurden und oft im Orient-Express zu sehen waren."
1480 = "William J. Palmer"
1481 = "Organisierte bis ins Kleinste mehrere erfolgreiche Kohletransporte für die Denver and Rio Grande Railroad und trieb den Ausbau der Eisenbahnen im amerikanischen Südwesten voran."
1482 = "George Stephenson"
1483 = "Ein bedeutender Wegbereiter der frühen Dampflokomotiven und des Eisenbahnwesens. Stephenson brachte sich selbst Lesen und Schreiben bei. Baute 1814 seine erste Dampflokomotive."
1484 = "William Strong"
1485 = "Hoch angesehen für seine Fähigkeit, sich mit den besten Leuten der Branche zu umgeben. Strong war ein strenger und erfolgreicher Direktor der ATSF-Bahn."
1486 = "Thomas Swann"
1487 = "Früher Spezialist für Wegerechte. Erwirkte 1848 Konzessionen von Virginia zur Ausweitung des B&O-Betriebs."
1488 = "Richard Trevithick"
1489 = "Schuf 1804 in Coalbrookdale, Großbritannien, die erste Lokomotive für ein Schienensystem."
1490 = "Ginery Twitchell"
1491 = "Politisch gut vernetzt, leitete Twitchell die Boston & Worchester RR und die ATSF RR und war 1867-73 Kongressabgeordneter."
1492 = "William C. VanHorne"
1493 = "Ihm wird die meisterhafte Gesamtleitung beim Bau der Canadian Pacific Railway Co. zugeschrieben."
1494 = "George Westinghouse"
1495 = "Ein erfinderisches Genie. Westinghouse schuf eine Vielzahl von Sicherheitseinrichtungen für Lokomotiven, nicht zuletzt die Sicherheitssignale und die Druckluftbremse."
1496 = "Roy B. White"
1497 = "Übernahm den Betrieb der B&O während der Krise des Zweiten Weltkriegs. Die Anforderungen an die Eisenbahnen der ganzen Welt wurden in dieser Zeit bis an die Grenzen belastet."
1498 = "Daniel Willard"
1499 = "Willard war für seinen Fleiß und seine Kreativität bekannt und vor allem eines: zuverlässig."
1500 = "Albert Alonzo Robinson"
1501 = "Robinson war als Leiter der ATSF-Bahn für das Verlegen von über 5.000 Meilen Gleis verantwortlich. Robinson hatte den Ruf von Ehrlichkeit und Integrität"
1502 = "Philip Randolph"
1503 = "Randolph gründete 1935 die Gewerkschaft Brotherhood of Sleeping Car Porters. Später wurde er 1957 Vizepräsident des AFL-CIO."
1504 = "Andrew Carnegie"
1505 = "In Schottland geboren, leitete Carnegie den Pittsburgher Abschnitt der Pennsylvania Railway und wurde später einer der ersten Hersteller stählerner Eisenbahnbrücken. Carnegie ist vor allem als großer Philanthrop in Erinnerung."
1506 = "Rudolph Diesel"
1507 = "Diesel erfand den ölbetriebenen Motor, der später seinen Namen tragen sollte. Leider sorgten schlechte Finanzgeschäfte und skrupellose Geschäftsleute für Diesels finanziellen Ruin."
1508 = "Ben Holladay"
1509 = "Holladay war einer der erfolgreichsten frühen Postkutschenbetreiber im Westen der USA. Holladay kaufte den Pony Express und machte ein Vermögen mit dem Transport von Post und Fracht durch den Westen. Spätere Fehlinvestitionen in Eisenbahnen in Oregon und die Panik von 1873 kosteten ihn sein Vermögen."
1510 = "Bat Masterson"
1511 = "Scout, Indianerkämpfer, Büffeljäger und Eisenbahnarbeiter: Masterson war eine Studie in Legenden des amerikanischen Westens. Als Hilfssheriff von Dodge City und Wachmann wurde Masterson zu einem legendären Revolverhelden."
1512 = "Henry Booth"
1513 = "Leiter der Liverpool & Manchester Railway im Jahr 1829. Half bei der Entwicklung der ersten Betriebsverfahren für Eisenbahnen."
1514 = "Andre Chapelon"
1515 = "Die Arbeit dieses Franzosen revolutionierte den Bau von Dampflokomotiven. Seine Umbauten bestehender Dampflokomotiven brachten enorme Leistungssteigerungen. Viele seiner Konstruktionen wurden weltweit übernommen."
1516 = "Thomas Crampton"
1517 = "Cramptons Lokomotivkonstruktionen waren in seiner Heimat Großbritannien nicht beliebt, in Frankreich und Deutschland dafür sehr, und beeinflussten den Bau auf dem europäischen Festland über Jahrhunderte."
1518 = "Dr. Robert Garbe"
1519 = "Ein bedeutender Eisenbahningenieur der Preußischen Staatsbahnen von 1895 bis 1917. Seine Lokomotivkonstruktion P8 4-6-0 fand weltweite Verbreitung."
1520 = "Herbert Garratt"
1521 = "Patentierte eine einzigartige Gelenklokomotive, die ideal für enge Kurven und effiziente Leistungserzeugung war. Leider fanden diese Konstruktionen in den USA und Europa nie Anklang, wurden aber in vielen anderen Ländern stark genutzt."
1522 = "Henri Giffard"
1523 = "Giffard erfand einen Dampfstrahlinjektor, der die Dampferzeugung steigerte; Dampf war Kraft."
1524 = "Allen MacNab"
1525 = "Direktor der Great Western Railway und von 1830 bis 1862 kanadischer Abgeordneter."
1526 = "George Pullman"
1527 = "Der Gründer der Pullman Palace Car Company. Seine Salon- und Schlafwagenkonstruktionen revolutionierten den Personenverkehr der Eisenbahnen rund um den Globus."
1528 = "Dr. Wilhelm Schmidt"
1529 = "Während seiner Arbeit für die Preußischen Staatsbahnen führte Dr. Schmidt den Überhitzer in die Welt der Dampflokomotiven ein. Das war eine wesentliche Gesamtverbesserung der Dampfkraft."
1530 = "Ernst Siemens"
1531 = "Der geniale deutsche Erfinder Siemens schuf 1879 das erste praktisch nutzbare Elektrofahrzeug und auch die erste öffentliche Straßenbahn."
1532 = "Robert Stevens"
1533 = "Ein bekannter Konstrukteur von Fähren und Dampfschiffen. Stevens erfand die 'T'-Schiene, den Schienennagel und verbesserte Verfahren zum Verlegen des Bahnkörpers."
1534 = "John Wootten"
1535 = "Entwarf den 'Wootten-Feuerkasten', der Anthrazitkohle verbrennen konnte. Die Fähigkeit, diese minderwertige Kohle zu verfeuern, brachte Dampflokomotiven mit dieser Vorrichtung große Einsparungen."
1539 = ""
1540 = "Dieser Spieler wird beim Spielstart zufällig zugewiesen."
1541 = "Otto Von Bismarck"
1542 = "Auch bekannt als der Eiserne Kanzler Deutschlands. Hatte stark in Eisenbahnen investiert, bevor er die Verstaatlichung durchsetzte und die Regierung alle Privatbahnen für eine hübsche Summe aufkaufen ließ."
1543 = "Gerson Von Bleichroder"
1544 = "Finanzberater Bismarcks. Einer der reichsten Männer Europas in den 1880er Jahren. Organisierte die Finanzierung vieler kaiserlich-deutscher Eisenbahnen im In- und Ausland."
1545 = "Isambard Kingdom Brunel"
1546 = "Ein erfinderischer und hervorragender Ingenieur seiner Zeit mit einem Blick für das Großartige. Gründete die Great Western, die South Wales und die Great Eastern Railway in England."
1547 = "Jay Cooke"
1548 = "Ein hoch angesehener Bankier und Finanzier. Cooke wickelte die Bundesanleihen ab, die den Norden im Amerikanischen Bürgerkrieg finanzierten."
1549 = "Charles Crocker"
1550 = "Crocker war die 'Ochsenpeitsche' der 'Großen Vier' der Central Pacific Railroad. Crocker erledigte die Drecksarbeit, den Bau des Abschnitts der CPR an der amerikanischen transkontinentalen Eisenbahn zu überwachen."
1551 = "Henckel von Donnersmarck"
1552 = "Ein geschickter Aristokrat des industriellen Deutschlands der 1880er Jahre."
1553 = "Daniel Drew"
1554 = "Gab zusammen mit Fisk und Gould verwässerte Aktien aus, um Vanderbilt erfolgreich an der Übernahme der Erie Railroad zu hindern. Später untergruben seine beiden 'Partner' ihn finanziell und ließen ihn bankrott zurück."
1555 = "Sir John Forrest"
1556 = "Forrest, 1905 Premier von Westaustralien, war ein starker Befürworter einer Eisenbahn quer durch Australien. Als Forscher war er zu Fuß über den Kontinent gelaufen und kannte die Probleme, die eine solche Bahn mit sich bringen würde."
1557 = "James Fisk"
1558 = "'Big Jim' lebte sein Leben ohne Rücksicht auf seinen Ruf. Versuchte zusammen mit J. Gould, den Goldmarkt zu beherrschen. Die darauf folgende Panik löste den Börsencrash des 'Schwarzen Freitags' von 1869 in den USA aus."
1559 = "Sir Sanford Fleming"
1560 = "Vermaß die Trasse der Canadian Pacific Railway. Galt als guter Ingenieur und unermüdlicher Arbeiter."
1561 = "John C. Fremont"
1562 = "Machte sein Vermögen, als auf seinem Land in Kalifornien Gold entdeckt wurde. Fremont war Forscher und Fürsprecher eines mittleren Weges zum Pazifik entlang des Santa-Fe-Trails."
1563 = "Jay Gould"
1564 = "Begann mit 21 Jahren, mit Eisenbahnen zu spekulieren. Versuchte zusammen mit Fisk, den Goldmarkt zu beherrschen, was den Börsencrash von 1869, auch als Schwarzer Freitag bekannt, auslöste."
1565 = "Adolph von Hansemann"
1566 = "Mitbegründer der Rumänischen Eisenbahngesellschaft, deren Neuordnung Ende der 1800er Jahre das Vermögen vieler europäischer Aristokraten rettete."
1567 = "Edward Henry Harriman"
1568 = "Ein aggressiver Eisenbahnmagnat, der 1907 von der Interstate Commerce Commission für seine Geschäftspraktiken verurteilt wurde. Harriman war der Erzrivale von James Hill."
1569 = "James Hill"
1570 = "Enger Freund von J.P. Morgan und gewiefter Investor. Sein Kampf mit Harriman um die Chicago, Burlington and Quincy Railroad löste die Finanzpanik von 1901 aus."
1571 = "Sir Francis Hincks"
1572 = "Als Mitglied der kanadischen Regierung in den 1800er Jahren half Hincks 1854 bei der Gründung der Nova Scotia Railway."
1573 = "Cyrus K. Holliday"
1574 = "Ein tatkräftiger Unternehmer, Holliday gründete 1869 die Santa Fe Railway. Er half auch bei der Gründung der Stadt Topeka, Kansas."
1575 = "Mark Hopkins"
1576 = "Als Mitglied der 'Großen Vier' der Central Pacific RR war Hopkins ein finanzieller Geizhals und wurde oft 'der sturste Mann der Welt' genannt."
1577 = "Collis Huntington"
1578 = "Ein weiteres Mitglied der 'Großen Vier' der CPR, Huntington war als der 'Große Überredner' bekannt, der den Wettbewerb einschränkte und der US-Regierung Gelder abpresste."
1579 = "J.P. Morgan"
1580 = "Morgan spezialisierte sich auf die Schaffung riesiger Unternehmenszusammenschlüsse, die oft viele arbeitslos machten, aber die Leistung der Unternehmen verbesserten. Schuf den Riesen U.S. Steel Corporation."
1581 = "George Platner"
1582 = "Platner schuf 1833 die erste deutsche Eisenbahn, die Nürnberg-Fürther. Der Engländer William Wilson wurde als erster Lokomotivführer dieser Strecke zu einer richtigen Berühmtheit."
1583 = "Cecil Rhodes"
1584 = "Als Sohn eines englischen Predigers geboren. Rhodes machte sein Vermögen in den frühen südafrikanischen Diamantminen. Später versuchte er, eine Eisenbahn von Kapstadt in Südafrika nach Kairo in Ägypten zu bauen. Rhodes starb 1902, und die Bahn ist bis heute nicht fertiggestellt."
1585 = "Thomas Scott"
1586 = "Obwohl er ein erfahrener Eigentümer der Pennsylvania Railroad war, verlor Scott durch politische Winkelzüge den Kampf um das Wegerecht für eine südliche transkontinentale Eisenbahn gegen C. Huntington."
1587 = "Leland Stanford"
1588 = "Begann als Anwalt in Wisconsin und endete als Senator und Gouverneur des Bundesstaates Kalifornien. Stanford war die politische Muskelkraft der 'Großen Vier' der CPR."
1589 = "Sir George Stephen"
1590 = "Half beim Bau der Canadian Pacific Railway. Stephen arbeitete als Angestellter in einem Wollverarbeitungsunternehmen und wurde in 10 Jahren dessen Mehrheitsaktionär."
1591 = "Lord Strathconda"
1592 = "Auch bekannt als Donald Smith. Als Schotte nach Kanada ausgewandert, begann Smith seine Laufbahn bei der Hudson Bay Co. Spät im Leben übernahm er zusammen mit Hill und Stephen eine bankrotte Linie in Minnesota, die später als Great Northern bekannt wurde."
1593 = "George F. Train"
1594 = "Galt als wilder Investor mit Midas-Händchen. Bei einer Verzögerung im Bau der Union Pacific baute Train in Omaha ein Hotel, weil ihm das vorhandene nicht gefiel. Ein leidenschaftlicher Mann, dessen Reden die Leute gern hörten."
1595 = "Cornelius Vanderbilt"
1596 = "Begann mit der Gründung einer Fähre nach Staten Island. Vanderbilt war ein aggressiver Konzernbauer. Er gründete die New York Central Railroad und machte mit der ersten Bahnverbindung von New York nach Chicago einen enormen Gewinn."
1597 = "Kaiser Meiji"
1598 = "Meiji öffnete Japan für die Industrialisierung und führte Dampflokomotiven in Japan ein. Da Meiji für Facharbeit nicht von Westlern abhängig sein wollte, schickte er auch viele Menschen zum Studium ins Ausland, damit sie für Japan wichtige Technik mitbringen."
1599 = "George Hudson"
1600 = "Hudson kam auf die altmodische Art zu Geld: Er erbte es. Hudsons Leidenschaft, alle britischen Eisenbahnen zu kontrollieren, führte Großbritannien in einen skandalösen Tanz um wertlose Bahnfinanzierungen. Hudson hätte das frühe Aushängeschild für künftige Eisenbahnbarone sein können."
1601 = "Napoleon III"
1602 = "Kaiser von Frankreich in der Mitte bis zum Ende der 1800er Jahre. Napoleon III. wird zugeschrieben, die französische Eisenbahn stark ausgebaut zu haben. Ihm wird auch Unfähigkeit nachgesagt - man kann eben nicht alles haben."
1603 = "Philip Thomas"
1604 = "Gab sein Amt als Kommissar des Chesapeake & Ohio Canal auf, um Präsident der Baltimore & Ohio zu werden, der ersten voll betriebsfähigen Dampfeisenbahn der USA."
1605 = "Thomas Durant"
1606 = "Ein Zahlenfuchs mit Großmachtträumen. Durant gründete die Credit Mobilier of America, um die Regierung um Millionen zu betrügen. Die Operation war so erfolgreich, dass er die Kontrolle darüber an den Politiker Oakes Ames verlor."
1607 = "Jawaharlal Nehru"
1608 = "Nehru wurde 1947 der erste Premierminister Indiens. Nach seiner Wahl begann er sofort mit umfassenden Verbesserungen der industriellen Infrastruktur Indiens."
1609 = "Clement Attlee"
1610 = "Als Premierminister des Vereinigten Königreichs 1945 begann Attlee neben vielen anderen tiefgreifenden Änderungen die Verstaatlichung der britischen Eisenbahnen."
1611 = "General Gentaro"
1612 = "Während der imperialistischen Expansion Japans Ende der 1800er Jahre regierte Gentaro Taiwan. Obwohl die Herrschaft hart war, brachte sie auch eine dringend benötigte industrielle Infrastruktur."
1613 = "Mao Zedong"
1614 = "Mao führte die Kommunistische Partei Chinas im Bürgerkrieg zum Sieg und einte China. Mao begann eine umfassende Neuordnung der Industrie und der Gesellschaftsstruktur Chinas, von der natürlich nicht alles unbedingt gut war. Noch heute baut China hervorragende Dampflokomotiven."
1615 = "Chiang Kai-Shek"
1616 = "Einte China Mitte der 1930er Jahre unter einer Regierung. Der Ausbruch des Krieges mit Japan und ein Bürgerkrieg beendeten Chiangs Pläne für ein industrialisiertes China vorzeitig."
1617 = "William Wheelwright"
1618 = "In den USA geboren, suchte Wheelwright sein Glück in Südamerika. Wheelwright baute 1848 die erste Eisenbahn Südamerikas und gründete die Grand Central Argentine Railway."
1619 = "Minor Keith"
1620 = "Keith schuf die International Railways of Central America. Stets wachsam erkannte Keith die Chance im Anbau von Bananen entlang seiner Bahnstrecken und machte ein Vermögen mit der Obstproduktion."
1624 = "Gesellschaftsbargeld"
1625 = "Spielerbargeld"
1626 = "Wirtschaftslage"
