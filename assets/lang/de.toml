2413 = "Version"
2420 = "Willkommen bei Railroad Tycoon II!\n\nWir empfehlen, das Handbuch zu lesen, um alle Informationen zum Spielen zu erhalten.\n\nWir wissen aber auch, dass die meisten sofort loslegen möchten, ohne etwas zu lesen, und haben deshalb ein kleines Tutorial erstellt, das dem im Handbuch entspricht, aber weniger tief und detailliert ist.\n\nUm das Tutorial zu starten, wählen Sie 'Einzelspieler', dann 'Szenario laden' und doppelklicken Sie dann auf 'Tutorial'."
2421 = "Sehen Sie sich ein wenig um. Sie können die Kartenansicht bewegen, indem Sie die Maus an den Bildschirmrand schieben oder in das Radarfeld unten links klicken. Mit den Schaltflächen unten rechts können Sie die Karte drehen oder zoomen.\n\nWenn Sie bereit sind, Ihre Eisenbahn zu gründen, doppelklicken Sie in der Liste unten in der Bildschirmmitte auf <Neue Gesellschaft gründen>."
2422 = "Bevor es losgehen kann, müssen Sie eine Gesellschaft gründen.\n\nKlicken Sie unten in der Bildschirmmitte auf den Reiter 'Gesellschaft' (der Reiter ganz rechts - er ist vielleicht schon ausgewählt).\n\nDoppelklicken Sie dann auf <Neue Gesellschaft gründen>."
2423 = "Gut, jetzt richten Sie Ihre Gesellschaft ein.\n\nWir empfehlen dringend, Ihrer Gesellschaft zum Start so viel Geld wie möglich zu geben, indem Sie beide Schieberegler ganz nach rechts ziehen.\n\nGeben Sie Ihrer Gesellschaft dann einen Namen, wählen Sie ein Logo und klicken Sie auf <OK>"
2424 = "Es ist Zeit, einige Gleise zu verlegen und loszulegen.\n\nSuchen Sie zwei vielversprechende Städte, die nah beieinander liegen - wir empfehlen Slough und Oxford, westlich von London.\n\nUm Gleise zu verlegen, wählen Sie links auf dem Bildschirm die Gleisschaltfläche, klicken dann mit der linken Maustaste, halten sie gedrückt und ziehen vom Startpunkt zum Endpunkt. Sie sehen Zahlen für die Gleisbaukosten des jeweiligen Feldes und die Steigung dieses Abschnitts. (Versuchen Sie, die Steigungen unter 2 % zu halten.)"
2425 = "Wenn Ihre Gleise so liegen, wie Sie es möchten, klicken Sie erneut auf die Gleisbau-Schaltfläche, um den Gleisbaumodus zu verlassen."
2426 = "Nun müssen Sie an beiden Enden Ihrer Gleise Bahnhöfe errichten.\n\nKlicken Sie links auf dem Bildschirm auf die Bahnhofsschaltfläche und wählen Sie unten eine Bahnhofsgröße.\n\nGrößere Bahnhöfe sind teurer, ziehen aber Fracht aus einem größeren Gebiet an.\n\nWenn Sie den Bahnhof über die Karte bewegen, zeigt der beleuchtete Kreis das Gebiet, aus dem der Bahnhof Fracht bezieht.\n\nSetzen Sie den Bahnhof neben Ihre Gleise, bis er grün wird, und klicken Sie dann, um ihn zu platzieren."
2427 = "Der Bau Ihres Bahnhofs ist erst der Anfang. Sie werden wahrscheinlich einige Nebengebäude für Ihren Bahnhof bauen wollen, um Ihre Züge zu versorgen und ihre Effizienz zu steigern.\n\nZunächst empfehlen wir dringend einen Wasserturm, einen Sandturm und einen Ringlokschuppen in Ihrem Hauptbahnhof. (In jedem Bahnhof brauchen Sie sie vermutlich nicht.)\n\nKlicken Sie auf <Kaufen> und bauen Sie jedes der Gebäude.\n\nWenn Sie fertig sind, drücken Sie <ZURÜCK>, um zum Hauptbildschirm zurückzukehren, und platzieren Sie dann Ihren zweiten Bahnhof."
2428 = "Gut, Sie haben Gleise und Bahnhöfe - das letzte entscheidende Element sind natürlich Züge. Klicken Sie links auf die Zugschaltfläche und kaufen Sie einen Zug."
2429 = "Auf diesem Bildschirm richten Sie Ihre Züge ein und steuern sie.\n\nMit nur zwei Bahnhöfen ist die Streckenplanung ziemlich einfach, aber wenn Sie weitere Bahnhöfe hinzufügen, müssen Sie auswählen, wohin jeder Zug fährt, indem Sie die Bahnhöfe von der Karte rechts in die Streckenliste links ziehen.\n\nSie müssen auch wählen, welche Fracht befördert wird. Klicken Sie oben rechts auf den Schalter, um in den Frachtmodus zu wechseln, und klicken Sie dann auf die passenden Frachtarten, je nachdem, welche Fracht der Bahnhof verfügbar hat (unten auf dem Bildschirm angezeigt)."
2430 = "Noch ein paar Hinweise zur Hauptoberfläche:\n\n- Mit dem kleinen Schieberegler am rechten Bildschirmrand steuern Sie die Spielgeschwindigkeit (oder mit den Tasten '+' und '-').\n\n- Klicken Sie auf das Fenster unten rechts, um durch verpasste Nachrichten zurückzublättern.\n\n- Klicken Sie unten auf die Reiter, um Bahnhöfe, Züge, Spieler und Gesellschaften anzuzeigen.\n\n- Klicken Sie auf die kleine Pfeilschaltfläche über der Liste, um sie zu erweitern."
2431 = "Die Börse - nützlich, um große Vermögen in kleine zu verwandeln.\n\nDa Sie wahrscheinlich Ihr ganzes Privatgeld zur Gründung Ihrer Gesellschaft verwendet haben, müssen Sie sich auf der leichten Stufe kaum Sorgen machen.\n\nWenn Sie Ihr Bargeld durch Dividenden und das Gehalt Ihres Vorsitzenden wieder aufbauen, können Sie mehr eigene Aktien kaufen, in Ihre Konkurrenten investieren, deren Aktien leerverkaufen, auf Kredit kaufen und überhaupt Spaß haben, wie ihn nur die Jungs von der Wall Street kennen."
2432 = "Gesellschaftsdetails\n\nAuf diesem Bildschirm überwachen Sie das Schicksal Ihrer Gesellschaft und Ihrer Konkurrenten.\n\nEin paar wichtige Funktionen - im Bereich Überblick können Sie den Manager der Gesellschaft (Ihren Untergebenen) wechseln und sich für andere Fähigkeiten und vielleicht ein anderes Preisschild entscheiden.\n\nIm Bereich Finanzen können Sie Aktien und Anleihen ausgeben und die Finanzzu- und -abflüsse insgesamt steuern."
2433 = "Spielerdetails\n\nNun ja, die Eisenbahnbarone des 19. Jahrhunderts sind nicht gerade eine hübsche Truppe - hier zählt nicht das Aussehen, sondern das Geld.\n\nAuf diesem Bildschirm können Sie Ihre Konkurrenz (falls vorhanden) und Ihre eigene Biografie ansehen.\n\nUm andere Spieler anzusehen, klicken Sie unten rechts auf dem Bildschirm auf die Pfeile nach links und rechts."
2434 = "Wenn Sie knapp bei Kasse sind, können Sie auf dem Gesellschaftsbildschirm Aktien oder Anleihen ausgeben.\n\nKlicken Sie unten auf den Reiter Gesellschaft, doppelklicken Sie dann auf Ihre Gesellschaft, klicken Sie auf den Bereich Finanzen und geben Sie Aktien oder Anleihen aus."
2435 = "Wieder da und noch nicht genug?\n\nWir empfehlen, die Kampagne zu starten. Die ersten Szenarien sind relativ leicht, und Sie können das Spiel meistern, um sich auf die schweren Szenarien weiter hinten vorzubereiten.\n\nWenn Sie dagegen nur herumspielen möchten, versuchen Sie <Einzelspieler> - <Neue Karte> und klicken Sie dann auf <Optionen> - <Sandkastenmodus>. Der Sandkastenmodus ist zum reinen Herumspielen da - kein Geld, keine Sorgen - einfach Gleise verlegen und Züge fahren lassen."
2436 = "Im Sandkastenmodus spielen Sie nicht um Geld und treten in keiner Weise gegen andere an. Bauen und genießen Sie einfach.\n\nSie erhalten außerdem einige neue Werkzeuge zum Spielen. Probieren Sie sie aus - es sind dieselben Werkzeuge, mit denen im Karteneditor neue Karten erstellt werden."
2437 = "Bei fortgeschrittenem oder Experten-Industriemodell sind die verschiedenen Industrien viel wichtiger.\n\nUm den vollen Wert Ihrer Fracht zu erhalten, müssen Sie sie zu einem Bahnhof bringen, an dem sie nachgefragt wird.\n\nBringen Sie zum Beispiel Getreide zu jedem Bahnhof, in dessen Nähe eine Bäckerei liegt.\n\nDie Bäckerei zahlt einen Aufpreis für das Getreide und verarbeitet es zu Lebensmitteln, die Sie zu jeder Stadt bringen können, mit schönem Gewinn.\n\nSie können auf der Karte auf jedes Gebäude klicken, um herauszufinden, was es liefert und nachfragt."
2438 = "Mit dem Editor können Sie die Spielkarten ändern oder eigene erstellen.\n\nIn dieser Demoversion können Sie keine Karten speichern, sondern nur im Editor herumspielen. In der Vollversion des Spiels können Sie Karten speichern, über das Internet tauschen, neue Karten herunterladen usw."
2440 = "Lässt man einen Zug durch einen Bahnhof mit Wasserturm, Sandturm und/oder Ringlokschuppen fahren, werden die Wasser-, Sand- und Wartungswerte dieses Zuges jeweils zurückgesetzt, auch wenn der Zug in diesem Bahnhof gar nicht hält."
2441 = "Sie können jederzeit einen Screenshot aufnehmen, indem Sie die Taste <Druck> drücken. Er wird als .PCX-Datei im Hauptverzeichnis von RT2 gespeichert."
2442 = "Der Bau eines Zollamts in einem Bahnhof halbiert die Zollwartezeiten - nützlich, wenn Sie einen Hafen nutzen oder in einem internationalen Szenario spielen."
2443 = "Klicken Sie auf das kleine Vorfahrtssymbol links neben jedem Zug in der Zugliste des Hauptbildschirms, um die Priorität dieses Zuges zu ändern.\n\nZüge mit höherer Priorität zwingen Züge mit niedrigerer Priorität, anzuhalten und sie passieren zu lassen, wenn sie sich begegnen."
2444 = "Mit der Pause-Taste halten Sie das Spiel an.\n\nDrücken Sie sie erneut, um fortzufahren.\n\nMit den Plus- und Minus-Tasten können Sie ebenfalls die Spielgeschwindigkeit steuern."
2445 = "Wenn das Spiel bei Ihnen etwas zäh läuft, klicken Sie links auf der Hauptoberfläche auf die Schaltfläche Einstellungen, dann auf 'Grafik' und verringern Sie einige der Einstellungen."
2446 = "Hält man die Strg-Taste gedrückt, während man mit der linken Maustaste auf die Spielkarte klickt, wird die Spielansicht automatisch auf diese Stelle zentriert."
2447 = "Alle Städte wachsen mit der Zeit, wenn sie mit Verkehr und Ressourcen versorgt werden.\n\nJe mehr Sie liefern, desto schneller wachsen sie.\n\nDie am besten versorgten Städte können auf das Dreifache ihrer ursprünglichen Größe oder mehr anwachsen."
