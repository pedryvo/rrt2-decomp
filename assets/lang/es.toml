2410 = "Tutorial"
2411 = "El borde es visible"
2412 = "Los mapas de la campaña aún no están conectados.  Lo sentimos, por ahora solo puedes echar un vistazo."
2413 = "Versión"
2420 = "¡Te damos la bienvenida a Railroad Tycoon II!\n\nTe recomendamos leer el manual para conocer toda la información sobre cómo jugar.\n\nTambién sabemos que la mayoría quiere lanzarse de cabeza sin leer nada, así que hemos creado un pequeño tutorial que sigue el del manual, aunque con menos profundidad y detalle.\n\nPara iniciar el tutorial, selecciona 'Un jugador', luego 'Cargar escenario' y haz doble clic en 'Tutorial'."
2421 = "Echa un vistazo por los alrededores.  Puedes mover la vista del mapa llevando el ratón a los bordes de la pantalla o haciendo clic en el cuadro del radar, abajo a la izquierda.  Puedes girar o acercar el mapa con los botones de abajo a la derecha.\n\nCuando estés listo para iniciar tu ferrocarril, haz doble clic en <Fundar una nueva compañía> en la lista del centro, en la parte inferior de la pantalla."
2422 = "Antes de empezar, necesitarás fundar una compañía.\n\nHaz clic en la pestaña 'Compañía' de la parte inferior central de la pantalla (la pestaña de más a la derecha; puede que ya esté seleccionada).\n\nLuego haz doble clic en <Fundar una nueva compañía>."
2423 = "Muy bien, ahora toca configurar tu compañía.\n\nSe recomienda encarecidamente darle a tu compañía todo el dinero posible para empezar, deslizando ambas barras de desplazamiento hasta el extremo derecho.\n\nLuego ponle nombre a tu compañía, elige un logotipo y haz clic en <Aceptar>"
2424 = "Es hora de tender vía y ponerse en marcha.\n\nBusca dos ciudades prometedoras, cercanas entre sí; te sugerimos Slough y Oxford, al oeste de Londres.\n\nPara tender vía, selecciona el botón de vía en el lado izquierdo de la pantalla, luego mantén pulsado el botón izquierdo del ratón y arrastra desde el punto de inicio hasta el punto final.  Verás números que indican el costo de tender vía en una casilla concreta y la pendiente (inclinación) de ese tramo.  (Intenta mantener las pendientes por debajo del 2%)."
2425 = "Cuando tengas la vía trazada como quieres, haz clic de nuevo en el botón de tender vía para salir del modo de tendido."
2426 = "Ahora tienes que colocar estaciones en cada extremo de tu vía.\n\nHaz clic en el botón de estación en el lado izquierdo de la pantalla y elige un tamaño de estación en la parte inferior.\n\nLas estaciones más grandes son más caras, pero recogen carga de un área mayor.\n\nMientras mueves la estación por el mapa, el círculo iluminado indica el área de la que se abastecerá.\n\nColoca la estación junto a tu vía hasta que se ponga verde y haz clic para situarla."
2427 = "Construir la estación es solo el comienzo; seguramente querrás construir algunos edificios de apoyo para atender a tus trenes y mejorar su eficiencia.\n\nPara empezar, te recomendamos encarecidamente una torre de agua, una torre de arena y una rotonda en tu estación principal.  (Probablemente no las necesites en todas las estaciones.)\n\nHaz clic en <Comprar> y construye cada uno de los edificios.\n\nCuando termines, pulsa <SALIR> para volver a la pantalla principal y coloca tu segunda estación."
2428 = "Muy bien, ya tienes vía y estaciones; el último elemento crítico son, por supuesto, los trenes.  Haz clic en el botón de tren de la izquierda y compra un tren."
2429 = "Usa esta pantalla para configurar y controlar tus trenes.\n\nCon solo dos estaciones, la ruta es muy sencilla, pero a medida que añadas estaciones tendrás que elegir adónde va cada tren arrastrando las estaciones del mapa de la derecha a la lista de ruta de la izquierda.\n\nTambién tendrás que elegir qué cargas transportar.  Haz clic en el interruptor de arriba a la derecha para cambiar al modo de carga y luego haz clic en las cargas apropiadas, según las que tenga disponibles la estación (se muestran en la parte inferior de la pantalla)."
2430 = "Algunas notas adicionales sobre la interfaz principal:\n\n- Usa el pequeño control deslizante del lado derecho de la pantalla para controlar la velocidad del juego (o usa las teclas '+' y '-' del teclado).\n\n- Haz clic en la ventana de abajo a la derecha para retroceder por los mensajes que te hayas perdido.\n\n- Haz clic en las pestañas de abajo para ver estaciones, trenes, jugadores y compañías, respectivamente.\n\n- Haz clic en el pequeño botón de flecha sobre la lista para expandirla."
2431 = "La bolsa: útil para convertir grandes fortunas en pequeñas.\n\nComo probablemente usaste todo tu dinero personal para fundar tu compañía, no tendrás mucho de qué preocuparte en el nivel fácil.\n\nCuando empieces a reconstruir tu efectivo con los dividendos y el salario de presidente, podrás comprar más acciones propias, invertir en tus competidores, vender sus acciones en corto, comprar con margen y, en general, divertirte como solo saben los chicos de Wall Street."
2432 = "Detalle de la compañía\n\nUsa esta pantalla para vigilar la fortuna de tu compañía y la de tus competidores.\n\nAlgunas funciones clave: en la sección de resumen puedes cambiar al gerente de la compañía (tu subordinado) y optar por otro conjunto de habilidades y quizá otro precio.\n\nEn la sección de finanzas puedes emitir acciones y bonos y, en general, controlar las entradas y salidas de financiación."
2433 = "Detalle del jugador\n\nBueno, los barones ferroviarios del siglo XIX no son precisamente un grupo apuesto; aquí no cuenta el aspecto, sino el dinero.\n\nPuedes usar esta pantalla para conocer a tu competencia (si la hay) y tu propia biografía.\n\nPara ver a otros jugadores, haz clic en las flechas izquierda y derecha de la parte inferior derecha de la pantalla."
2434 = "Si andas escaso de efectivo, puedes emitir acciones o bonos en la pantalla de la compañía.\n\nHaz clic en la pestaña de compañía en la parte inferior de la pantalla, luego haz doble clic en tu compañía, después en la sección de finanzas y emite acciones o bonos."
2435 = "¿Vuelves por más?\n\nTe recomendamos iniciar la campaña.  Los primeros escenarios son relativamente fáciles y podrás dominar el juego como preparación para los escenarios difíciles que vienen después.\n\nPor el contrario, si solo quieres divertirte sin más, prueba <Un jugador> - <Nuevo mapa> y luego haz clic en <Opciones> - <Modo sandbox>.  El modo sandbox es para jugar sin compromiso: sin dinero, sin preocupaciones; solo tender vía y hacer circular trenes."
2436 = "En el modo sandbox no juegas por dinero ni compites de ninguna manera.  Solo construye y disfruta.\n\nAdemás obtienes algunas herramientas nuevas con las que jugar.  Pruébalas: son las mismas que se usan para crear mapas nuevos en el editor de mapas."
2437 = "Con el modelo industrial avanzado o experto, las distintas industrias son mucho más importantes.\n\nPara obtener el valor completo de tus cargas, debes transportarlas a una estación donde se demanden.\n\nPor ejemplo, lleva cereales a cualquier estación que tenga una panadería cerca.\n\nLa panadería pagará un extra por los cereales y los convertirá en alimentos, que podrás llevar a cualquier ciudad para obtener un buen beneficio.\n\nPuedes hacer clic en cualquier edificio del mapa para saber qué suministra y qué demanda."
2438 = "El editor te permite modificar los mapas del juego o crear los tuyos.\n\nEn esta versión de demostración no puedes guardar mapas, así que solo puedes jugar con el editor.  En la versión completa del juego podrás guardar mapas, intercambiarlos por internet, descargar mapas nuevos, etc."
2440 = "Si pasas un tren por una estación que tenga una torre de agua, una torre de arena y/o una rotonda, se restablecerán los niveles de agua, arena y mantenimiento de ese tren, respectivamente, aunque el tren no se detenga en esa estación."
2441 = "Puedes hacer una captura de pantalla en cualquier momento pulsando la tecla <Impr Pant>.  Se guardará como archivo .PCX en el directorio raíz de RT2."
2442 = "Construir una aduana en una estación reduce a la mitad los tiempos de espera en la aduana; es útil cuando usas un puerto o en un escenario internacional."
2443 = "Haz clic en el pequeño icono de ceda el paso, a la izquierda de cada tren en la lista de trenes de la pantalla principal, para cambiar la prioridad de ese tren.\n\nLos trenes de mayor prioridad obligarán a los de menor prioridad a detenerse y dejarlos pasar si se encuentran."
2444 = "Pulsar la tecla Pausa detiene el juego.\n\nVolver a pulsarla lo reanuda.\n\nTambién puedes usar las teclas más y menos para controlar la velocidad del juego."
2445 = "Si el juego va un poco lento, haz clic en el botón de ajustes del lado izquierdo de la interfaz principal, luego en 'Gráficos' y baja algunos de los valores."
2446 = "Mantener pulsada la tecla Ctrl mientras haces clic izquierdo en el mapa del juego centrará automáticamente la vista del juego en esa ubicación."
2447 = "Todas las ciudades crecerán con el tiempo si reciben servicio y recursos.\n\nCuanto más les suministres, más rápido crecerán.\n\nLas ciudades mejor abastecidas pueden crecer hasta tres veces su tamaño original o más."
2448 = "Mantener pulsada la tecla Ctrl mientras usas las teclas de flecha desplaza la pantalla más rápido."
