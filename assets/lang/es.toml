1456 = "Ames Oakes"
1457 = "Oakes fue congresista por el estado de Massachusetts.  Fue condenado por su participación en el escándalo del Crédit Mobilier con el ferrocarril Union Pacific."
1458 = "Frederick Billings"
1459 = "Un gerente competente del Northern Pacific Railroad de 1875 a 1881.  Billings perdió el control del NPR a manos de Henry Villard, quien lo llevó a la quiebra dos años después."
1460 = "Eugene V. Debs"
1461 = "Debs fundó la Unión Ferroviaria Estadounidense en 1893 y también fue fundador del Partido Socialista de EE. UU.  Fue un verdadero antihéroe en los anales ferroviarios estadounidenses.  Podría venirte bien tenerlo de tu lado."
1462 = "John Work Garrett"
1463 = "Convirtió la mal administrada compañía B&O Railroad en una potencia.  Dirigió el B&O durante 26 años tras una exitosa toma de control por parte de los accionistas en 1858."
1464 = "Robert Gerwig"
1465 = "Ingeniero de construcción alemán, Gerwig estuvo a cargo de la construcción del ferrocarril de la Selva Negra.  Gerwig demostró ser un excelente constructor de vías y túneles."
1466 = "Daniel Gooch"
1467 = "Ayudó a introducir la vía ancha en Inglaterra como superintendente del Great Western Railway en 1845."
1468 = "Charles Melville Hays"
1469 = "Un estadounidense contratado para reorganizar el ferrocarril Canadian Grand Trunk en 1895.  Hays era conocido por su eficiencia despiadada."
1470 = "Johns Hopkins"
1471 = "Próspero comerciante de Baltimore, Hopkins es recordado como filántropo.  También rescató al ferrocarril B&O en 1847."
1472 = "Theodore D. Judah"
1473 = "'El loco Ted Judah' fue un visionario del ferrocarril.  Judah, defensor de la causa del ferrocarril transcontinental, tenía un acuerdo para comprar el Central Pacific Railroad; sin embargo, mientras viajaba de Nicaragua a Nueva York para cerrar el trato, contrajo la fiebre amarilla y murió."
1474 = "Charles F. Mayer"
1475 = "Mayer tenía tendencia a expandirse al dirigir ferrocarriles.  Por suerte, también se le daba bien."
1476 = "Oscar G. Murray"
1477 = "Murray fue considerado uno de los mejores directores de tráfico de su época.  Dirigió el B&O Railroad de 1904 a 1910."
1478 = "George Nagelmachers"
1479 = "La versión belga de George Pullman.  Fundó la compañía Wagons-Lits y creó los vagones de pasajeros usados en toda Europa, que con frecuencia aparecían en el Orient Express."
1480 = "William J. Palmer"
1481 = "Gestionó al detalle varios exitosos transportes de carbón para el Denver and Rio Grande Railroad e impulsó la expansión de los ferrocarriles en el suroeste de Estados Unidos."
1482 = "George Stephenson"
1483 = "Un gran contribuyente a las primeras locomotoras de vapor y al ferrocarril.  Stephenson aprendió a leer y escribir por su cuenta.  Construyó su primera locomotora de vapor en 1814."
1484 = "William Strong"
1485 = "Muy valorado por su capacidad de rodearse de los mejores profesionales del sector.  Strong fue un director severo y exitoso del ferrocarril ATSF."
1486 = "Thomas Swann"
1487 = "Uno de los primeros especialistas en derechos de paso.  Obtuvo concesiones de Virginia para ampliar las operaciones del B&O en 1848."
1488 = "Richard Trevithick"
1489 = "Creó la primera locomotora para un sistema ferroviario en Coalbrookdale, Reino Unido, en 1804."
1490 = "Ginery Twitchell"
1491 = "Con buenas conexiones políticas, Twitchell dirigió el Boston & Worchester RR y el ATSF RR, además de ser miembro del Congreso de 1867 a 1873."
1492 = "William C. VanHorne"
1493 = "Se le atribuye la experta gestión general de la construcción del Canadian Pacific Railway Co."
1494 = "George Westinghouse"
1495 = "Un genio inventivo.  Westinghouse creó diversos dispositivos de seguridad para locomotoras, entre ellos las señales de seguridad y el freno de aire."
1496 = "Roy B. White"
1497 = "Se hizo cargo de las operaciones del B&O durante la crisis de la Segunda Guerra Mundial.  La demanda sobre los ferrocarriles de todo el mundo llegó a sus límites en esa época."
1498 = "Daniel Willard"
1499 = "Conocido por ser diligente y creativo, Willard era, ante todo, una persona confiable."
1500 = "Albert Alonzo Robinson"
1501 = "Robinson fue responsable del tendido de más de 5.000 millas de vía al frente del ferrocarril ATSF.  Robinson tenía fama de honestidad e integridad"
1502 = "Philip Randolph"
1503 = "Randolph fundó el sindicato Brotherhood of Sleeping Car Porters en 1935.  Más tarde se convirtió en vicepresidente de la AFL-CIO en 1957."
1504 = "Andrew Carnegie"
1505 = "Nacido en Escocia, Carnegie dirigió la sección de Pittsburgh del Pennsylvania Railway y más tarde se convirtió en uno de los primeros fabricantes de puentes ferroviarios de acero.  Carnegie es recordado sobre todo como un gran filántropo."
1506 = "Rudolph Diesel"
1507 = "Diesel inventó el motor de combustión de petróleo que más tarde llevaría su nombre.  Por desgracia para Diesel, los malos negocios y los empresarios sin escrúpulos garantizaron su fracaso financiero."
1508 = "Ben Holladay"
1509 = "Holladay fue uno de los primeros operadores de diligencias más exitosos del oeste de EE. UU.  Compró el Pony Express y se hizo rico transportando correo y carga por el oeste.  Más tarde, las malas inversiones en ferrocarriles de Oregón y el pánico de 1873 le costaron su fortuna."
1510 = "Bat Masterson"
1511 = "Explorador, cazador de indios, cazador de búfalos y trabajador ferroviario, Masterson fue un estudio de las leyendas del oeste estadounidense.  Como alguacil adjunto de Dodge City y hombre de seguridad, Masterson se convirtió en un legendario pistolero."
1512 = "Henry Booth"
1513 = "Gerente del Liverpool & Manchester Railway en 1829.  Ayudó a desarrollar los primeros procedimientos de operación ferroviaria."
1514 = "Andre Chapelon"
1515 = "El trabajo de este francés revolucionó el diseño de las locomotoras de vapor.  Su conversión de locomotoras de vapor existentes produjo enormes aumentos de potencia.  Muchos de sus diseños se adoptaron en todo el mundo."
1516 = "Thomas Crampton"
1517 = "Los diseños de locomotoras de Crampton, aunque poco populares en su Gran Bretaña natal, fueron muy populares en Francia y Alemania e influyeron durante siglos en los diseños de la Europa continental."
1518 = "Dr. Robert Garbe"
1519 = "Destacado ingeniero ferroviario de los Ferrocarriles Estatales Prusianos de 1895 a 1917.  Su diseño de locomotora P8 4-6-0 se distribuyó por todo el mundo."
1520 = "Herbert Garratt"
1521 = "Patentó una singular locomotora articulada ideal para curvas cerradas y generación eficiente de potencia.  Por desgracia, estos diseños nunca se popularizaron en EE. UU. ni en Europa, pero tuvieron un gran uso en muchos otros países."
1522 = "Henri Giffard"
1523 = "Giffard inventó un inyector de agua que aumentaba la producción de vapor; el vapor era potencia."
1524 = "Allen MacNab"
1525 = "Director del Great Western Railway y legislador canadiense de 1830 a 1862."
1526 = "George Pullman"
1527 = "El creador de la Pullman Palace Car Company.  Sus diseños de coches salón y coches cama revolucionaron el servicio de pasajeros de los ferrocarriles de todo el mundo."
1528 = "Dr. Wilhelm Schmidt"
1529 = "Mientras trabajaba para los Ferrocarriles Estatales Prusianos, el Dr. Schmidt introdujo el sobrecalentador en el mundo de las locomotoras de vapor.  Fue una gran mejora general de la potencia del vapor."
1530 = "Ernst Siemens"
1531 = "Brillante inventor alemán, Siemens creó el primer vehículo eléctrico práctico en 1879 y también el primer tranvía público."
1532 = "Robert Stevens"
1533 = "Diseñador de transbordadores y barcos de vapor de cierta notoriedad.  Stevens inventó el riel en 'T', el clavo de vía y mejoró las técnicas de tendido del balasto ferroviario."
1534 = "John Wootten"
1535 = "Diseñó el 'hogar Wootten', que quemaba carbón antracita.  Poder quemar este carbón de baja calidad supuso grandes ahorros para las locomotoras de vapor que lo usaban."
1539 = ""
1540 = "Este jugador se asignará al azar al iniciar la partida."
1541 = "Otto Von Bismarck"
1542 = "Alias el Canciller de Hierro de Alemania.  Invirtió mucho en ferrocarriles antes de implantar la propiedad estatal, y logró que el gobierno comprara todos los ferrocarriles privados por una buena suma."
1543 = "Gerson Von Bleichroder"
1544 = "Asesor financiero de Bismarck.  Uno de los hombres más ricos de Europa en la década de 1880.  Organizó la financiación de muchos ferrocarriles del Imperio alemán, tanto dentro como fuera del país."
1545 = "Isambard Kingdom Brunel"
1546 = "Un ingeniero inventivo y excelente de su época, con visión de grandeza.  Fundó los ferrocarriles Great Western, South Wales y Great Eastern en Inglaterra."
1547 = "Jay Cooke"
1548 = "Un banquero y financiero muy confiable.  Cooke gestionó los préstamos federales que financiaron al Norte durante la Guerra Civil estadounidense."
1549 = "Charles Crocker"
1550 = "Crocker era el 'látigo' de los 'Cuatro Grandes' del Central Pacific Railroad.  Hizo el trabajo sucio de supervisar la instalación del tramo del CPR en el ferrocarril transcontinental estadounidense."
1551 = "Henckel von Donnersmarck"
1552 = "Un hábil aristócrata de la Alemania industrial de la década de 1880."
1553 = "Daniel Drew"
1554 = "Junto con Fisk y Gould, emitió acciones diluidas para impedir que Vanderbilt tomara el control del Erie Railroad.  Más tarde sus dos 'socios' lo socavaron financieramente y lo dejaron en la quiebra."
1555 = "Sir John Forrest"
1556 = "Primer ministro de Australia Occidental en 1905, Forrest fue un firme defensor de un ferrocarril transaustraliano.  Como explorador cruzó el continente a pie y conocía los problemas que enfrentaría un ferrocarril así."
1557 = "James Fisk"
1558 = "'Big Jim' vivió sin importarle su reputación.  Junto con J. Gould, intentó acaparar el mercado del oro.  El pánico resultante causó el desplome bursátil del 'Viernes Negro' de 1869 en EE. UU."
1559 = "Sir Sanford Fleming"
1560 = "Estudió el trazado del Canadian Pacific Railway.  Era considerado un buen ingeniero y un trabajador incansable."
1561 = "John C. Fremont"
1562 = "Hizo fortuna cuando se descubrió oro en sus tierras de California.  Fremont fue explorador y defensor de una ruta central al Pacífico por el sendero de Santa Fe."
1563 = "Jay Gould"
1564 = "Comenzó a especular con ferrocarriles a los 21 años.  Junto con Fisk, intentó acaparar el mercado del oro, lo que provocó el desplome bursátil de 1869, conocido como Viernes Negro."
1565 = "Adolph von Hansemann"
1566 = "Cofundó la Compañía de Ferrocarriles de Rumanía, cuya reorganización salvó las fortunas de muchos aristócratas europeos a finales del siglo XIX."
1567 = "Edward Henry Harriman"
1568 = "Un agresivo magnate ferroviario condenado en 1907 por la Comisión de Comercio Interestatal por sus prácticas comerciales.  Harriman era el archirrival de James Hill."
1569 = "James Hill"
1570 = "Amigo íntimo de J.P. Morgan e inversor astuto.  Su batalla con Harriman por el Chicago, Burlington and Quincy Railroad desencadenó el pánico financiero de 1901."
1571 = "Sir Francis Hincks"
1572 = "Miembro del gobierno canadiense en el siglo XIX, Hincks ayudó a fundar el Nova Scotia Railway en 1854."
1573 = "Cyrus K. Holliday"
1574 = "Un emprendedor motivado, Holliday fundó el Santa Fe Railway en 1869.  También ayudó a fundar la ciudad de Topeka, Kansas."
1575 = "Mark Hopkins"
1576 = "Miembro de los 'Cuatro Grandes' del Central Pacific RR, Hopkins era un tacaño financiero y se le llamaba a menudo 'el hombre más terco del mundo'."
1577 = "Collis Huntington"
1578 = "Otro de los 'Cuatro Grandes' del CPR, Huntington era conocido como el 'Gran Persuasor', pues limitaba la competencia y sacaba fondos al gobierno de EE. UU."
1579 = "J.P. Morgan"
1580 = "Morgan se especializó en crear enormes consolidaciones empresariales, que a menudo dejaban a muchos sin trabajo pero mejoraban el rendimiento de las empresas.  Creó la gigantesca U.S. Steel Corporation."
1581 = "George Platner"
1582 = "Platner creó el primer ferrocarril alemán, el de Núremberg a Fürth, en 1833.  El inglés William Wilson se hizo famoso como primer maquinista de esta línea."
1583 = "Cecil Rhodes"
1584 = "Hijo de un predicador inglés.  Rhodes hizo fortuna en las primeras minas de diamantes de Sudáfrica.  Luego intentó construir un ferrocarril de Ciudad del Cabo a El Cairo.  Murió en 1902 y el ferrocarril aún no se ha completado."
1585 = "Thomas Scott"
1586 = "Aunque era un veterano propietario del Pennsylvania Railroad, Scott perdió ante C. Huntington, mediante artimañas políticas, una batalla por el derecho de paso de un ferrocarril transcontinental del sur."
1587 = "Leland Stanford"
1588 = "Empezó como abogado en Wisconsin y acabó siendo senador y gobernador del estado de California.  Stanford era el músculo político de los 'Cuatro Grandes' del CPR."
1589 = "Sir George Stephen"
1590 = "Ayudó a construir el Canadian Pacific Railway.  Stephen trabajó como empleado en una fábrica de lana y en 10 años se convirtió en su accionista mayoritario."
1591 = "Lord Strathconda"
1592 = "Alias Donald Smith.  Escocés trasplantado a Canadá, la primera carrera de Smith fue en la Hudson Bay Co.  Ya mayor, trabajó con Hill y Stephen para hacerse con una línea quebrada de Minnesota que más tarde se conoció como Great Northern."
1593 = "George F. Train"
1594 = "Visto como un inversor salvaje con el toque de Midas.  Durante un retraso en la construcción del Union Pacific, Train construyó un hotel en Omaha porque no le gustaba el que había.  Hombre apasionado, a la gente le gustaba escuchar sus discursos."
1595 = "Cornelius Vanderbilt"
1596 = "Empezó creando un transbordador de Staten Island.  Vanderbilt fue un agresivo constructor de corporaciones.  Fundó el New York Central Railroad y obtuvo un enorme beneficio con el primer servicio ferroviario de Nueva York a Chicago."
1597 = "Emperador Meiji"
1598 = "Meiji abrió Japón a la industrialización e introdujo las locomotoras de vapor.  Como no quería depender de los occidentales para el trabajo especializado, envió a muchos al extranjero a estudiar y a traer tecnología importante para Japón."
1599 = "George Hudson"
1600 = "Hudson hizo su dinero a la antigua usanza: lo heredó.  Su pasión por controlar todos los ferrocarriles británicos llevó al país a un escandaloso baile de financiación sin valor.  Fue el primer cartel de los futuros barones del tren."
1601 = "Napoleón III"
1602 = "Emperador de Francia a mediados y finales del siglo XIX.  A Napoleón III se le atribuye haber ampliado enormemente el ferrocarril francés.  También se le atribuye ser incompetente, ¿no se puede tener todo?"
1603 = "Philip Thomas"
1604 = "Dejó su cargo de comisionado del Canal Chesapeake y Ohio para ser presidente del Baltimore & Ohio, el primer ferrocarril de vapor plenamente operativo de EE. UU."
1605 = "Thomas Durant"
1606 = "Un obseso de los números con sueños de grandeza, Durant organizó el Crédit Mobilier de América para estafar millones al gobierno.  La operación fue tan exitosa que perdió el control de ella a manos del político Oakes Ames."
1607 = "Jawaharlal Nehru"
1608 = "Nehru fue el primer primer ministro de la India en 1947.  Tras su elección, comenzó de inmediato grandes mejoras en la infraestructura industrial de la India."
1609 = "Clement Attlee"
1610 = "Como primer ministro del Reino Unido en 1945, Attlee inició la nacionalización de los ferrocarriles británicos, entre otros muchos cambios de gran alcance."
1611 = "General Gentaro"
1612 = "Durante la expansión imperialista de Japón a finales del siglo XIX, Gentaro gobernó Taiwán.  Aunque su gobierno fue duro, también trajo una infraestructura industrial muy necesaria."
1613 = "Mao Zedong"
1614 = "Mao llevó al Partido Comunista Chino a la victoria en la guerra civil y unificó China.  Inició una gran reorganización de las industrias y la estructura social, no todas necesariamente buenas.  Hoy China aún produce locomotoras de vapor."
1615 = "Chiang Kai-shek"
1616 = "Unificó China bajo un solo gobierno a mediados de la década de 1930.  El estallido de la guerra con Japón y una guerra civil truncaron los planes de Chiang de una China industrializada."
1617 = "William Wheelwright"
1618 = "Nacido en EE. UU., Wheelwright buscó fortuna en Sudamérica.  Construyó el primer ferrocarril de Sudamérica en 1848 y fundó el Gran Central Argentino."
1619 = "Minor Keith"
1620 = "Keith creó los Ferrocarriles Internacionales de Centroamérica.  Siempre alerta, vio una oportunidad en el cultivo de bananas a lo largo de sus vías y se hizo rico con la producción de fruta."
