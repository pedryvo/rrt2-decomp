2596 = "En el modo sandbox, simplemente construyes y haces circular trenes, sin tener en cuenta el dinero ni la competencia.  Básicamente, juegas en un gran arenero, sin competir a ningún nivel."
2597 = "Con el modelo financiero básico, la importancia de la bolsa se reduce al mínimo.  Puedes comprar o vender acciones de tu propia compañía, pero no puedes absorber otra compañía ni ser absorbido."
2598 = "Con el modelo financiero avanzado, la venta en corto y la compra de acciones con margen están desactivadas, pero están habilitados todos los demás aspectos de la bolsa (incluidas las absorciones, la inversión en otras compañías, etc.)."
2599 = "Con el modelo financiero experto, todos los aspectos de la bolsa están habilitados (lo que puede dar lugar a jugadas financieras bastante despiadadas; que no se diga que no te avisamos)."
2600 = "Con el modelo industrial básico, la economía se simplifica enormemente.  Cualquier estación aceptará cualquier carga (aunque a un precio algo menor si la carga no es demandada).  Todas las industrias producen cargas, aunque no estén bien abastecidas de lo que demandan."
2601 = "Con el modelo industrial avanzado, la economía es moderadamente sofisticada.  Las estaciones seguirán aceptando cualquier carga, pero las cargas no demandadas en una estación solo se pagan a mitad de precio.  Las industrias solo producirán cargas si están bien abastecidas de lo que demandan (si es que demandan algo)."
2602 = "Con el modelo industrial experto, la economía está en pleno apogeo.  Las estaciones solo pagarán una miseria por las cargas que no demandan.  Los niveles de precios influyen en lo que las estaciones están dispuestas a pagar por las cargas, aunque las demanden.  Tu compañía también puede comprar las industrias que le resulten atractivas."
2603 = "Aumenta o reduce los ingresos que reciben por transportar cargas las compañías controladas por humanos (es decir, tu compañía).  Con menos ingresos por carga, el juego es bastante más difícil."
2604 = "Aumenta o reduce los ingresos que reciben por transportar cargas las compañías controladas por la computadora.  Con menos ingresos por carga, las compañías de la computadora son menos rentables y una amenaza menor en conjunto."
