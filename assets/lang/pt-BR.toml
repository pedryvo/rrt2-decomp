1456 = "Ames Oakes"
1457 = "Oakes foi deputado federal pelo estado de Massachusetts.  Foi condenado por seu papel no escândalo do Crédit Mobilier envolvendo a Union Pacific Railroad."
1458 = "Frederick Billings"
1459 = "Gerente competente da Northern Pacific Railroad de 1875 a 1881.  Billings perdeu o controle da NPR para Henry Villard, que a levou à falência dois anos depois."
1460 = "Eugene V. Debs"
1461 = "Debs fundou a American Railway Union em 1893 e também o Partido Socialista dos EUA.  Foi um verdadeiro anti-herói na história ferroviária americana.  Seria bom tê-lo do seu lado."
1462 = "John Work Garrett"
1463 = "Transformou a mal administrada B&O Railroad Company numa potência.  Dirigiu a B&O por 26 anos após uma tomada de controle bem-sucedida pelos acionistas em 1858."
1464 = "Robert Gerwig"
1465 = "Engenheiro de construção alemão, Gerwig foi responsável pela construção da Ferrovia da Floresta Negra.  Mostrou-se um excelente construtor de vias e túneis."
1466 = "Daniel Gooch"
1467 = "Ajudou a introduzir a bitola larga na Inglaterra como superintendente da Great Western Railway em 1845."
1468 = "Charles Melville Hays"
1469 = "Americano contratado para reorganizar a Canadian Grand Trunk Railway em 1895.  Hays era conhecido por sua eficiência implacável."
1470 = "Johns Hopkins"
1471 = "Comerciante bem-sucedido de Baltimore, Hopkins é lembrado como filantropo.  Também salvou a ferrovia B&O em 1847."
1472 = "Theodore D. Judah"
1473 = "'O Louco Ted Judah' era um visionário das ferrovias.  Defensor da causa da ferrovia transcontinental, Judah tinha um acordo para comprar a Central Pacific Railroad; porém, a caminho da Nicarágua para Nova York para fechar o negócio, contraiu febre amarela e morreu."
1474 = "Charles F. Mayer"
1475 = "Mayer tinha tendência a expandir as ferrovias que dirigia.  Por sorte, também era bom nisso."
1476 = "Oscar G. Murray"
1477 = "Murray era considerado um dos melhores diretores de tráfego de sua época.  Dirigiu a B&O Railroad de 1904 a 1910."
1478 = "George Nagelmachers"
1479 = "Uma versão belga de George Pullman.  Fundou a companhia Wagons-Lits e criou vagões de passageiros usados em toda a Europa, frequentemente presentes no Expresso do Oriente."
1480 = "William J. Palmer"
1481 = "Gerenciou nos mínimos detalhes vários transportes de carvão bem-sucedidos da Denver and Rio Grande Railroad e impulsionou a expansão das ferrovias no sudoeste americano."
1482 = "George Stephenson"
1483 = "Grande contribuinte para as primeiras locomotivas a vapor e para a ferrovia.  Stephenson aprendeu a ler e escrever sozinho.  Construiu sua primeira locomotiva a vapor em 1814."
1484 = "William Strong"
1485 = "Respeitado por sua capacidade de se cercar das melhores pessoas do setor.  Strong foi um diretor rigoroso e bem-sucedido da ferrovia ATSF."
1486 = "Thomas Swann"
1487 = "Especialista pioneiro em direito de passagem.  Obteve concessões da Virgínia para expandir as operações da B&O em 1848."
1488 = "Richard Trevithick"
1489 = "Criou a primeira locomotiva para um sistema ferroviário em Coalbrookdale, Reino Unido, em 1804."
1490 = "Ginery Twitchell"
1491 = "Com boas conexões políticas, Twitchell dirigiu a Boston & Worchester RR e a ATSF RR, além de ser membro do Congresso de 1867 a 1873."
1492 = "William C. VanHorne"
1493 = "Reconhecido pela excelente gestão geral da construção da Canadian Pacific Railway Co."
1494 = "George Westinghouse"
1495 = "Um gênio inventivo.  Westinghouse criou diversos dispositivos de segurança para locomotivas, entre eles os sinais de segurança e o freio a ar."
1496 = "Roy B. White"
1497 = "Assumiu as operações da B&O durante a crise da Segunda Guerra Mundial.  A demanda sobre as ferrovias do mundo todo foi levada ao limite nesse período."
1498 = "Daniel Willard"
1499 = "Conhecido por ser diligente e criativo, Willard era, acima de tudo, confiável."
1500 = "Albert Alonzo Robinson"
1501 = "Robinson foi responsável pelo assentamento de mais de 5.000 milhas de via enquanto dirigia a ferrovia ATSF.  Tinha fama de honesto e íntegro"
1502 = "Philip Randolph"
1503 = "Randolph fundou o sindicato Brotherhood of Sleeping Car Porters em 1935.  Mais tarde tornou-se vice-presidente da AFL-CIO, em 1957."
1504 = "Andrew Carnegie"
1505 = "Nascido na Escócia, Carnegie dirigiu a seção de Pittsburgh da Pennsylvania Railway e depois se tornou um dos primeiros fabricantes de pontes ferroviárias de aço.  Carnegie é lembrado principalmente como grande filantropo."
1506 = "Rudolph Diesel"
1507 = "Diesel inventou o motor a óleo que mais tarde levaria seu nome.  Infelizmente para Diesel, negócios financeiros ruins e empresários inescrupulosos garantiram o seu fracasso financeiro."
1508 = "Ben Holladay"
1509 = "Holladay foi um dos mais bem-sucedidos operadores pioneiros de diligências do oeste dos EUA.  Comprou o Pony Express e fez fortuna transportando correio e carga pelo oeste.  Mais tarde, maus investimentos em ferrovias do Oregon e o pânico de 1873 lhe custaram a fortuna."
1510 = "Bat Masterson"
1511 = "Batedor, combatente de índios, caçador de búfalos e ferroviário, Masterson foi um estudo das lendas do Oeste americano.  Como subxerife de Dodge City e segurança, tornou-se um pistoleiro lendário."
1512 = "Henry Booth"
1513 = "Gerente da Liverpool & Manchester Railway em 1829.  Ajudou a desenvolver os primeiros procedimentos operacionais das ferrovias."
1514 = "Andre Chapelon"
1515 = "O trabalho deste francês revolucionou o projeto de locomotivas a vapor.  Suas conversões de locomotivas existentes produziram enormes aumentos de potência.  Muitos de seus projetos foram adotados no mundo todo."
1516 = "Thomas Crampton"
1517 = "Os projetos de locomotivas de Crampton, embora pouco populares em sua terra natal, a Grã-Bretanha, fizeram muito sucesso na França e na Alemanha e influenciaram projetos na Europa continental por séculos."
1518 = "Dr. Robert Garbe"
1519 = "Engenheiro ferroviário de destaque das Ferrovias Estatais Prussianas de 1895 a 1917.  Seu projeto de locomotiva P8 4-6-0 foi distribuído pelo mundo todo."
1520 = "Herbert Garratt"
1521 = "Patenteou uma locomotiva articulada singular, ideal para curvas fechadas e geração eficiente de potência.  Infelizmente, esses projetos nunca ganharam popularidade nos EUA ou na Europa, mas foram muito usados em vários outros países."
1522 = "Henri Giffard"
1523 = "Giffard inventou um injetor de água que aumentava a produção de vapor; vapor era potência."
1524 = "Allen MacNab"
1525 = "Diretor da Great Western Railway e legislador canadense de 1830 a 1862."
1526 = "George Pullman"
1527 = "Criador da Pullman Palace Car Company.  Seus projetos de vagões-salão e vagões-dormitório revolucionaram o serviço de passageiros nas ferrovias do mundo todo."
1528 = "Dr. Wilhelm Schmidt"
1529 = "Trabalhando para as Ferrovias Estatais Prussianas, o Dr. Schmidt apresentou o superaquecedor ao mundo das locomotivas a vapor.  Foi uma grande melhoria geral na potência a vapor."
1530 = "Ernst Siemens"
1531 = "Brilhante inventor alemão, Siemens criou o primeiro veículo elétrico prático em 1879 e também o primeiro bonde público."
1532 = "Robert Stevens"
1533 = "Projetista de balsas e barcos a vapor de certa notoriedade.  Stevens inventou o trilho em 'T', o cravo ferroviário e técnicas melhoradas de assentamento do leito da ferrovia."
1534 = "John Wootten"
1535 = "Projetou a 'Fornalha Wootten', capaz de queimar carvão antracito.  A capacidade de queimar esse carvão de baixa qualidade gerou grande economia para as locomotivas a vapor com esse dispositivo."
1539 = ""
1540 = "Este jogador será sorteado no início do jogo."
1541 = "Otto von Bismarck"
1542 = "Também conhecido como o Chanceler de Ferro da Alemanha.  Investiu pesado em ferrovias antes de instituir a estatização e fazer o governo comprar todas as ferrovias privadas por uma quantia generosa."
1543 = "Gerson von Bleichröder"
1544 = "Consultor financeiro de Bismarck.  Um dos homens mais ricos da Europa na década de 1880.  Organizou o financiamento de muitas ferrovias do Império Alemão, dentro e fora do país."
1545 = "Isambard Kingdom Brunel"
1546 = "Engenheiro inventivo e excelente para a sua época, com olhar para o grandioso.  Fundou as ferrovias Great Western, South Wales e Great Eastern na Inglaterra."
1547 = "Jay Cooke"
1548 = "Banqueiro e financista de grande confiança.  Cooke cuidou dos empréstimos federais que financiaram o Norte durante a Guerra Civil Americana."
1549 = "Charles Crocker"
1550 = "Crocker era o 'Chicote' dos 'Quatro Grandes' da Central Pacific Railroad.  Fazia o trabalho sujo de supervisionar a instalação do trecho da CPR na ferrovia transcontinental americana."
1551 = "Henckel von Donnersmarck"
1552 = "Aristocrata habilidoso da Alemanha industrial da década de 1880."
1553 = "Daniel Drew"
1554 = "Com Fisk e Gould, emitiu ações diluídas numa tentativa bem-sucedida de impedir que Vanderbilt tomasse o controle da Erie Railroad.  Mais tarde seus dois 'sócios' o minaram financeiramente e o deixaram falido."
1555 = "Sir John Forrest"
1556 = "Premiê da Austrália Ocidental em 1905, Forrest foi um forte defensor de uma ferrovia transaustraliana.  Como explorador, atravessou o continente a pé e conhecia os problemas que tal ferrovia enfrentaria."
1557 = "James Fisk"
1558 = "'Big Jim' viveu sem se importar com a reputação.  Com J. Gould, tentou monopolizar o mercado do ouro.  O pânico resultante causou a quebra da 'Sexta-Feira Negra' de 1869 nos EUA."
1559 = "Sir Sanford Fleming"
1560 = "Fez o levantamento do traçado da Canadian Pacific Railway.  Era considerado um bom engenheiro e trabalhador incansável."
1561 = "John C. Frémont"
1562 = "Fez fortuna quando foi descoberto ouro em suas terras na Califórnia.  Frémont foi explorador e defensor de uma rota central até o Pacífico pela trilha de Santa Fé."
1563 = "Jay Gould"
1564 = "Começou a especular com ferrovias aos 21 anos.  Com Fisk, tentou monopolizar o mercado do ouro, o que provocou a quebra de 1869, também conhecida como Sexta-Feira Negra."
1565 = "Adolph von Hansemann"
1566 = "Cofundador da Companhia Ferroviária Romena, cuja reorganização salvou as fortunas de muitos aristocratas europeus no fim do século XIX."
1567 = "Edward Henry Harriman"
1568 = "Magnata agressivo das ferrovias, condenado em 1907 pela Comissão de Comércio Interestadual por suas práticas comerciais.  Harriman era o maior rival de James Hill."
1569 = "James Hill"
1570 = "Grande amigo de J.P. Morgan e investidor astuto.  Sua batalha com Harriman pela Chicago, Burlington and Quincy Railroad desencadeou o pânico financeiro de 1901."
1571 = "Sir Francis Hincks"
1572 = "Membro do governo canadense no século XIX, Hincks ajudou a fundar a Nova Scotia Railway em 1854."
1573 = "Cyrus K. Holliday"
1574 = "Empreendedor determinado, Holliday fundou a Santa Fe Railway em 1869.  Também ajudou a fundar a cidade de Topeka, no Kansas."
1575 = "Mark Hopkins"
1576 = "Membro dos 'Quatro Grandes' da Central Pacific RR, Hopkins era um avarento financeiro, muitas vezes chamado de 'O Homem Mais Teimoso do Mundo'."
1577 = "Collis Huntington"
1578 = "Outro dos 'Quatro Grandes' da CPR, Huntington era conhecido como o 'Grande Persuasor', limitando a concorrência e espremendo verbas do governo dos EUA."
1579 = "J.P. Morgan"
1580 = "Morgan se especializou em criar enormes consolidações empresariais, muitas vezes deixando muita gente sem emprego, mas melhorando o desempenho das empresas.  Criou a gigante U.S. Steel Corporation."
1581 = "George Platner"
1582 = "Platner criou a primeira ferrovia alemã, a Nuremberg-Fürth, em 1833.  O inglês William Wilson tornou-se uma verdadeira celebridade como primeiro maquinista dessa linha."
1583 = "Cecil Rhodes"
1584 = "Filho de um pregador inglês.  Rhodes fez fortuna nas primeiras minas de diamantes sul-africanas.  Mais tarde tentou construir uma ferrovia da Cidade do Cabo, na África do Sul, até o Cairo, no Egito.  Rhodes morreu em 1902 e a ferrovia ainda não foi concluída."
1585 = "Thomas Scott"
1586 = "Embora fosse um experiente dono da Pennsylvania Railroad, Scott perdeu para C. Huntington, por trapaças políticas, uma disputa de direito de passagem para uma ferrovia transcontinental ao sul."
1587 = "Leland Stanford"
1588 = "Começou como advogado em Wisconsin e acabou senador e governador do estado da Califórnia.  Stanford era o braço político dos 'Quatro Grandes' da CPR."
1589 = "Sir George Stephen"
1590 = "Ajudou a construir a Canadian Pacific Railway.  Stephen trabalhou como balconista numa fábrica de tecidos de lã e em 10 anos se tornou seu acionista majoritário."
1591 = "Lord Strathcona"
1592 = "Também conhecido como Donald Smith.  Escocês radicado no Canadá, sua primeira carreira foi na Hudson Bay Co.  Já mais velho, trabalhou com Hill e Stephen para assumir uma linha falida de Minnesota que depois ficou conhecida como Great Northern."
1593 = "George F. Train"
1594 = "Visto como um investidor selvagem com o toque de Midas.  Durante um atraso na construção da Union Pacific, Train construiu um hotel em Omaha porque não gostava do que havia lá.  Homem apaixonado, as pessoas adoravam ouvir seus discursos."
1595 = "Cornelius Vanderbilt"
1596 = "Começou com uma balsa para Staten Island.  Vanderbilt foi um construtor corporativo agressivo.  Fundador da New York Central Railroad, teve lucro enorme com o primeiro serviço ferroviário de Nova York a Chicago."
1597 = "Imperador Meiji"
1598 = "Meiji abriu o Japão à industrialização e introduziu as locomotivas a vapor no país.  Sem querer depender de ocidentais para o trabalho qualificado, também enviou muita gente ao exterior para estudar e trazer tecnologia importante para o Japão."
1599 = "George Hudson"
1600 = "Hudson fez dinheiro à moda antiga: herdou.  Sua paixão por controlar todas as ferrovias britânicas levou a Grã-Bretanha a uma escandalosa dança de financiamentos ferroviários sem valor.  Hudson poderia ter sido o primeiro garoto-propaganda dos futuros Barões das Ferrovias."
1601 = "Napoleão III"
1602 = "Imperador da França em meados e fins do século XIX.  Napoleão III é creditado por ter expandido muito a ferrovia francesa.  Também é creditado como incompetente; não se pode ter tudo, não é?"
1603 = "Philip Thomas"
1604 = "Deixou o cargo de comissário do Canal Chesapeake & Ohio para se tornar presidente da Baltimore & Ohio, a primeira ferrovia a vapor totalmente operacional dos EUA."
1605 = "Thomas Durant"
1606 = "Um nerd dos números com sonhos de grandeza, Durant organizou o Crédit Mobilier of America para extorquir milhões do governo.  A operação foi tão bem-sucedida que ele perdeu o controle dela para o político Oakes Ames."
1607 = "Jawaharlal Nehru"
1608 = "Nehru foi o primeiro primeiro-ministro da Índia, em 1947.  Logo após a eleição, começou grandes melhorias na infraestrutura industrial indiana."
1609 = "Clement Attlee"
1610 = "Primeiro-ministro do Reino Unido em 1945.  Attlee iniciou a nacionalização das ferrovias britânicas, entre muitas outras mudanças amplas."
1611 = "General Gentaro"
1612 = "Durante a expansão imperialista do Japão no fim do século XIX, Gentaro governou Taiwan.  Embora o governo fosse duro, trouxe também uma infraestrutura industrial muito necessária."
1613 = "Mao Tsé-Tung"
1614 = "Mao levou o Partido Comunista Chinês à vitória na guerra civil e unificou a China.  Iniciou uma grande reorganização das indústrias e da estrutura social chinesas, nem tudo necessariamente bom.  Hoje, a China ainda produz ótimas locomotivas a vapor."
1615 = "Chiang Kai-Shek"
1616 = "Uniu a China sob um só governo em meados da década de 1930.  A eclosão da guerra com o Japão e uma guerra civil interromperam os planos de Chiang para uma China industrializada."
1617 = "William Wheelwright"
1618 = "Nascido nos EUA, Wheelwright buscou fortuna na América do Sul.  Construiu a primeira ferrovia da América do Sul em 1848 e iniciou a Grand Central Argentine Railway."
1619 = "Minor Keith"
1620 = "Keith criou as Ferrovias Internacionais da América Central.  Sempre atento, percebeu a oportunidade no cultivo de bananas ao longo de suas ferrovias e fez fortuna com a produção de frutas."
