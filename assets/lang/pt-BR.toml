2413 = "Versão"
2420 = "Bem-vindo ao Railroad Tycoon II!\n\nRecomendamos ler o manual para obter todas as informações sobre como jogar.\n\nSabemos também que a maioria das pessoas quer mergulhar direto no jogo sem ler nada, então criamos um pequeno tutorial que acompanha o do manual, embora com menos profundidade e detalhes.\n\nPara iniciar o tutorial, selecione 'Um jogador', depois 'Carregar cenário' e dê um clique duplo em 'Tutorial'."
2421 = "Dê uma olhada ao redor.  Você pode mover a visão do mapa levando o mouse até as bordas da tela ou clicando na caixa do radar, no canto inferior esquerdo.  Você pode girar ou dar zoom no mapa com os botões no canto inferior direito.\n\nQuando estiver pronto para começar sua ferrovia, dê um clique duplo em <Abrir uma nova empresa> na lista no centro inferior da tela."
2422 = "Antes de começar, você precisa abrir uma empresa.\n\nClique na guia 'Empresa', no centro inferior da tela (a guia mais à direita - ela pode já estar selecionada).\n\nDepois dê um clique duplo em <Abrir uma nova empresa>."
2423 = "Muito bem, agora você vai configurar sua empresa.\n\nÉ altamente recomendável dar à sua empresa o máximo de dinheiro possível no início, deslizando as duas barras de rolagem até a extremidade direita.\n\nDepois dê um nome à empresa, escolha um logotipo e clique em <OK>"
2424 = "É hora de assentar algumas vias e começar.\n\nEncontre duas cidades promissoras, próximas uma da outra - sugerimos Slough e Oxford, a oeste de Londres.\n\nPara assentar via, selecione o botão de via no lado esquerdo da tela, depois clique com o botão esquerdo do mouse, mantenha-o pressionado e arraste do ponto inicial até o ponto final.  Você verá números indicando o custo de assentamento da via em cada quadrado e a rampa (inclinação) daquele trecho.  (Procure manter as rampas abaixo de 2%)."
2425 = "Depois de assentar a via do jeito que quiser, clique de novo no botão de assentar via para sair do modo de assentamento."
2426 = "Agora você precisa colocar estações nas duas pontas da via.\n\nClique no botão de estação no lado esquerdo da tela e escolha um tamanho de estação na parte de baixo.\n\nEstações maiores são mais caras, mas captam carga de uma área maior.\n\nEnquanto você move a estação pelo mapa, o círculo iluminado indica a área de captação da estação.\n\nColoque a estação ao lado da via de modo que fique verde e clique para posicioná-la."
2427 = "Construir a estação é só o começo; você provavelmente vai querer construir alguns edifícios de apoio para atender seus trens e melhorar sua eficiência.\n\nPara começar, recomendamos fortemente uma caixa-d'água, uma torre de areia e uma rotunda na sua estação principal.  (Provavelmente não são necessárias em todas as estações.)\n\nClique em <Comprar> e construa cada um dos edifícios.\n\nQuando terminar, pressione <SAIR> para voltar à tela principal e coloque sua segunda estação."
2428 = "Muito bem, você tem via e estações; o último elemento essencial são os trens, claro.  Clique no botão de trem à esquerda e compre um trem."
2429 = "Use esta tela para configurar e controlar seus trens.\n\nCom apenas duas estações, a rota é bem simples, mas à medida que você adicionar estações, precisará escolher para onde cada trem vai arrastando as estações do mapa à direita para a lista de rota à esquerda.\n\nVocê também precisará escolher quais cargas transportar.  Clique na chave no canto superior direito para mudar para o modo de cargas e depois clique nas cargas adequadas, de acordo com as cargas disponíveis na estação (mostradas na parte de baixo da tela)."
2430 = "Algumas observações adicionais sobre a interface principal:\n\n- Use o pequeno controle deslizante no lado direito da tela para controlar a velocidade do jogo (ou use as teclas '+' e '-' do teclado).\n\n- Clique na janela no canto inferior direito para voltar nas mensagens que você perdeu.\n\n- Clique nas guias na parte de baixo para ver estações, trens, jogadores e empresas, respectivamente.\n\n- Clique no pequeno botão de seta acima da lista para expandi-la."
2431 = "A bolsa de valores: útil para transformar grandes fortunas em pequenas.\n\nComo você provavelmente usou todo o seu dinheiro pessoal para abrir a empresa, não terá muito com que se preocupar no nível fácil.\n\nQuando começar a reconstruir seu caixa com dividendos e com o salário de presidente, você poderá comprar mais ações da sua própria empresa, investir nos concorrentes, vender as ações deles a descoberto, comprar com margem e, em geral, se divertir como só os rapazes de Wall Street sabem."
2432 = "Detalhes da empresa\n\nUse esta tela para acompanhar a sorte da sua empresa e dos concorrentes.\n\nAlguns recursos importantes: na seção Visão geral você pode trocar o gerente da empresa (seu subordinado), optando por um conjunto diferente de habilidades e talvez por um preço diferente.\n\nNa seção de finanças, você pode emitir ações e títulos e controlar de modo geral as entradas e saídas de financiamento."
2433 = "Detalhes do jogador\n\nBem, os barões das ferrovias do século XIX não eram exatamente um grupo de beldades; aqui o que conta não é a aparência, e sim o dinheiro.\n\nVocê pode usar esta tela para conferir a concorrência (se houver) e a sua própria biografia.\n\nPara ver outros jogadores, clique nas setas esquerda e direita no canto inferior direito da tela."
2434 = "Se estiver com falta de dinheiro, você pode emitir ações ou títulos na tela da empresa.\n\nClique na guia da empresa na parte de baixo da tela, dê um clique duplo na sua empresa, clique na seção de finanças e emita ações ou títulos."
2435 = "Voltou para mais?\n\nRecomendamos começar a campanha.  Os primeiros cenários são relativamente fáceis, e você dominará o jogo para se preparar para os cenários difíceis mais adiante.\n\nPor outro lado, se você só quer se divertir, tente <Um jogador> - <Novo mapa>, depois clique em <Opções> - <Modo caixa de areia>.  O modo caixa de areia é para diversão pura: sem dinheiro, sem preocupações; basta assentar vias e pôr trens para rodar."
2436 = "No modo caixa de areia, você não joga por dinheiro nem compete de forma alguma.  Basta construir e curtir.\n\nVocê também ganha algumas ferramentas novas para brincar.  Experimente-as: são as mesmas usadas para criar mapas no editor de mapas."
2437 = "Com o modelo industrial avançado ou especialista, as diferentes indústrias são muito mais importantes.\n\nPara obter o valor integral das suas cargas, é preciso levá-las a uma estação onde sejam demandadas.\n\nPor exemplo, leve grãos a qualquer estação que tenha uma padaria por perto.\n\nA padaria pagará um preço melhor pelos grãos e os converterá em alimentos, que podem ser levados a qualquer cidade com bom lucro.\n\nVocê pode clicar em qualquer edifício do mapa para descobrir o que ele oferece e demanda."
2438 = "O editor permite modificar os mapas do jogo ou criar os seus próprios.\n\nNesta versão de demonstração, não é possível salvar mapas, então você só pode brincar no editor.  Na versão completa do jogo, você poderá salvar mapas, trocá-los pela internet, baixar novos mapas etc."
2440 = "Passar um trem por uma estação que tenha caixa-d'água, torre de areia e/ou rotunda restabelece os níveis de água, areia e manutenção do trem, respectivamente, mesmo que o trem não pare de fato nessa estação."
2441 = "Você pode tirar uma captura de tela a qualquer momento pressionando a tecla <Print Screen>.  Ela será gravada como um arquivo .PCX no diretório raiz do RT2."
2442 = "Construir uma alfândega numa estação reduz pela metade os tempos de espera na alfândega - útil quando você usa um porto ou joga um cenário internacional."
2443 = "Clique no pequeno ícone de preferência no lado esquerdo de cada trem na lista de trens da tela principal para mudar a prioridade desse trem.\n\nTrens de maior prioridade obrigam os de menor prioridade a parar e dar passagem quando se encontram."
2444 = "Pressionar a tecla Pause pausa o jogo.\n\nPressioná-la de novo retoma o jogo.\n\nVocê também pode usar as teclas de mais e menos para controlar a velocidade do jogo."
2445 = "Se o jogo estiver rodando um pouco devagar, clique no botão de configurações no lado esquerdo da interface principal, depois em 'Gráficos', e reduza algumas das configurações."
2446 = "Manter pressionada a tecla Ctrl enquanto clica com o botão esquerdo no mapa do jogo centraliza automaticamente a visão nesse local."
