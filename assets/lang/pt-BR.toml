2597 = "No modelo financeiro básico, a importância da bolsa de valores é mínima.  Você pode comprar ou vender ações da sua própria empresa, mas não pode assumir o controle de outra empresa nem ser adquirido."
2598 = "No modelo financeiro avançado, a venda a descoberto e a compra de ações com margem ficam desativadas, mas todos os outros aspectos da bolsa de valores (inclusive aquisições, investimentos em outras empresas etc.) ficam ativados."
2599 = "No modelo financeiro especialista, todos os aspectos da bolsa de valores ficam ativados (o que pode gerar jogadas financeiras bem impiedosas - não diga que não avisamos)."
2600 = "No modelo industrial básico, a economia é bastante simplificada.  Qualquer estação aceita qualquer carga (embora por um preço um pouco menor se a carga não for demandada).  Todas as indústrias produzem cargas, mesmo que não estejam devidamente abastecidas com o que demandam."
2601 = "No modelo industrial avançado, a economia é moderadamente sofisticada.  As estações ainda aceitam qualquer carga, mas as cargas não demandadas numa estação só valem metade do preço.  As indústrias só produzem cargas se estiverem devidamente abastecidas com o que demandam (se for o caso)."
2602 = "No modelo industrial especialista, a economia está a pleno vapor.  As estações só pagam uma ninharia pelas cargas que não demandam.  Os níveis de preços afetam quanto as estações aceitam pagar pelas cargas, mesmo que as demandem.  Sua empresa também pode comprar as indústrias que achar atraentes."
2603 = "Aumenta ou diminui o valor da receita recebida pelas empresas controladas por humanos (ou seja, a sua empresa) pelo transporte de cargas.  Com menos receita por carga, o jogo fica bem mais difícil."
2604 = "Aumenta ou diminui o valor da receita recebida pelas empresas controladas pelo computador pelo transporte de cargas.  Com menos receita por carga, as empresas do computador ficam menos lucrativas e menos ameaçadoras."
