1456 = "Эймс Оукс"
1457 = "Оукс был конгрессменом от штата Массачусетс. Его осудили за участие в скандале с «Креди Мобилье» и компанией Union Pacific Railroad."
1458 = "Фредерик Биллингс"
1459 = "Грамотный управляющий Northern Pacific Railroad в 1875-1881 годах. Биллингс потерял контроль над NPR в пользу Генри Вилларда, который через два года довел дорогу до банкротства."
1460 = "Юджин В. Дебс"
1461 = "Дебс основал Американский железнодорожный союз в 1893 году, а также Социалистическую партию США. Настоящий антигерой в летописи американских железных дорог. Неплохо бы иметь его на своей стороне."
1462 = "Джон Уорк Гарретт"
1463 = "Превратил плохо управляемую компанию B&O Railroad в мощную силу. Руководил B&O 26 лет после успешного захвата контроля акционерами в 1858 году."
1464 = "Роберт Гервиг"
1465 = "Немецкий инженер-строитель, Гервиг руководил строительством Шварцвальдской железной дороги. Он зарекомендовал себя отличным строителем путей и тоннелей."
1466 = "Дэниел Гуч"
1467 = "Помог внедрить широкую колею в Англии, будучи управляющим Great Western Railway в 1845 году."
1468 = "Чарльз Мелвилл Хейс"
1469 = "Американец, приглашенный в 1895 году для реорганизации канадской Grand Trunk Railway. Хейс славился безжалостной эффективностью."
1470 = "Джонс Хопкинс"
1471 = "Успешный балтиморский торговец, Хопкинс хорошо запомнился как филантроп. В 1847 году он также выручил железную дорогу B&O."
1472 = "Теодор Д. Джуда"
1473 = "«Безумный Тед Джуда» был провидцем железных дорог. Джуда, ярый сторонник трансконтинентальной железной дороги, договорился о выкупе Central Pacific Railroad, но по пути из Никарагуа в Нью-Йорк для заключения сделки заболел желтой лихорадкой и умер."
1474 = "Чарльз Ф. Майер"
1475 = "Майер имел склонность к расширению железных дорог, которыми руководил. К счастью, у него это хорошо получалось."
1476 = "Оскар Г. Мюррей"
1477 = "Мюррей считался одним из лучших руководителей перевозок своего времени. Руководил B&O Railroad в 1904-1910 годах."
1478 = "Жорж Нагельмакерс"
1479 = "Бельгийский аналог Джорджа Пульмана. Основал компанию Wagons-Lits и создал пассажирские вагоны, которыми пользовалась вся Европа и которые часто ходили в составе «Восточного экспресса»."
1480 = "Уильям Дж. Палмер"
1481 = "Дотошно управлял несколькими успешными угольными перевозками Denver and Rio Grande Railroad и настойчиво продвигал расширение железных дорог на американском юго-западе."
1482 = "Джордж Стефенсон"
1483 = "Один из главных создателей первых паровозов и железных дорог. Стефенсон сам научился читать и писать. Построил свой первый паровоз в 1814 году."
1484 = "Уильям Стронг"
1485 = "Известен умением окружать себя лучшими людьми отрасли. Стронг был строгим и успешным директором железной дороги ATSF."
1486 = "Томас Суонн"
1487 = "Один из первых специалистов по полосе отвода. В 1848 году получил от Виргинии уступки для расширения деятельности B&O."
1488 = "Ричард Тревитик"
1489 = "Создал первый паровоз для рельсовой системы в Коулбрукдейле, Великобритания, в 1804 году."
1490 = "Джинери Твитчелл"
1491 = "Обладая политическими связями, Твитчелл руководил железными дорогами Boston & Worcester и ATSF, а в 1867-1873 годах был членом конгресса."
1492 = "Уильям К. Ван Хорн"
1493 = "Ему приписывают умелое общее руководство строительством Canadian Pacific Railway Co."
1494 = "Джордж Вестингауз"
1495 = "Гениальный изобретатель. Вестингауз создал множество устройств безопасности для паровозов, в первую очередь сигналы безопасности и воздушный тормоз."
1496 = "Рой Б. Уайт"
1497 = "Возглавил работу B&O в период кризиса Второй мировой войны. В это время нагрузка на железные дороги по всему миру достигла предела."
1498 = "Дэниел Уиллард"
1499 = "Известный усердием и изобретательностью, Уиллард был прежде всего надежным человеком."
1500 = "Альберт Алонсо Робинсон"
1501 = "Робинсон отвечал за прокладку более 5000 миль пути, возглавляя железную дорогу ATSF. Он слыл честным и порядочным человеком"
1502 = "Филип Рэндольф"
1503 = "Рэндольф основал профсоюз Brotherhood of Sleeping Car Porters в 1935 году. Позже, в 1957 году, он стал вице-президентом AFL-CIO."
1504 = "Эндрю Карнеги"
1505 = "Родившийся в Шотландии Карнеги руководил питтсбургским участком Pennsylvania Railway, а позже стал одним из первых производителей стальных железнодорожных мостов. Больше всего Карнеги запомнился как великий филантроп."
1506 = "Рудольф Дизель"
1507 = "Дизель изобрел двигатель на жидком топливе, который позже получил его имя. К несчастью для Дизеля, неудачные финансовые сделки и бессовестные дельцы привели его к финансовому краху."
1508 = "Бен Холлидей"
1509 = "Холлидей был одним из самых успешных первых владельцев почтовых дилижансов на западе США. Он купил «Пони-экспресс» и нажил состояние на перевозке почты и грузов по всему Западу. Позже неудачные вложения в железные дороги Орегона и паника 1873 года стоили ему состояния."
1510 = "Бат Мастерсон"
1511 = "Разведчик, борец с индейцами, охотник на бизонов и железнодорожный рабочий, Мастерсон был образцом легенд американского Запада. Будучи помощником шерифа Додж-Сити и охранником, Мастерсон стал легендарным стрелком."
1512 = "Генри Бут"
1513 = "Управляющий Liverpool & Manchester Railway в 1829 году. Помог разработать первые правила эксплуатации железных дорог."
1514 = "Андре Шапелон"
1515 = "Работы этого француза произвели переворот в конструировании паровозов. Его переделки существующих паровозов дали огромный прирост мощности. Многие его разработки были приняты во всем мире."
1516 = "Томас Крэмптон"
1517 = "Конструкции паровозов Крэмптона, хотя и не были популярны в его родной Британии, пользовались большим успехом во Франции и Германии и на протяжении веков влияли на конструкции в континентальной Европе."
1518 = "Доктор Роберт Гарбе"
1519 = "Видный железнодорожный инженер Прусских государственных железных дорог в 1895-1917 годах. Его локомотивы P8 4-6-0 распространились по всему миру."
1520 = "Герберт Гарратт"
1521 = "Запатентовал уникальный сочлененный локомотив, идеально подходящий для крутых кривых и эффективной выработки мощности. К сожалению, эти конструкции так и не завоевали популярность в США и Европе, но нашли широкое применение во многих других странах."
1522 = "Анри Жиффар"
1523 = "Жиффар изобрел водяной инжектор, увеличивавший выработку пара, а пар - это сила."
1524 = "Аллан Макнаб"
1525 = "Директор Great Western Railway и канадский законодатель в 1830-1862 годах."
1526 = "Джордж Пульман"
1527 = "Создатель Pullman Palace Car Company. Его конструкции салон-вагонов и спальных вагонов произвели переворот в пассажирских перевозках на железных дорогах всего мира."
1528 = "Доктор Вильгельм Шмидт"
1529 = "Работая в Прусских государственных железных дорогах, доктор Шмидт ввел в мир паровозов пароперегреватель. Это было крупное общее улучшение паровой тяги."
1530 = "Эрнст Сименс"
1531 = "Блестящий немецкий изобретатель, Сименс создал первое практичное электрическое транспортное средство в 1879 году, а также первую общественную уличную железную дорогу."
1532 = "Роберт Стивенс"
1533 = "Довольно известный конструктор паромов и пароходов. Стивенс изобрел Т-образный рельс, рельсовый костыль и усовершенствовал методы укладки железнодорожного полотна."
1534 = "Джон Вуттен"
1535 = "Сконструировал «топку Вуттена», сжигавшую антрацитовый уголь. Возможность сжигать этот низкосортный уголь дала паровозам большую экономию."
1539 = ""
1540 = "Этот игрок будет назначен случайно при запуске игры."
1541 = "Отто фон Бисмарк"
1542 = "Он же «Железный канцлер» Германии. Много вкладывал в железные дороги, пока не ввел государственную собственность и не заставил казну выкупить все частные дороги за кругленькую сумму."
1543 = "Герсон фон Блейхрёдер"
1544 = "Финансовый советник Бисмарка. Один из богатейших людей Европы 1880-х. Организовал финансирование многих имперских германских железных дорог в стране и за рубежом."
1545 = "Изамбард Кингдом Брюнель"
1546 = "Изобретательный и выдающийся инженер своего времени, мыслил масштабно. Основал английские железные дороги Great Western, South Wales и Great Eastern."
1547 = "Джей Кук"
1548 = "Пользовавшийся доверием банкир и финансист. Управлял федеральными займами, на которые Север воевал в Гражданской войне в США."
1549 = "Чарльз Крокер"
1550 = "«Кнут» «Большой четверки» Central Pacific Railroad. Взял на себя грязную работу по надзору за прокладкой участка CPR трансконтинентальной железной дороги США."
1551 = "Хенкель фон Доннерсмарк"
1552 = "Искусный аристократ промышленной Германии 1880-х."
1553 = "Дэниел Дрю"
1554 = "Вместе с Фиском и Гулдом выпустил «разводненные» акции, чтобы не дать Вандербилту захватить Erie Railroad. Позже оба «партнера» подорвали его финансы и оставили банкротом."
1555 = "Сэр Джон Форрест"
1556 = "Премьер Западной Австралии в 1905 году, Форрест рьяно ратовал за Трансавстралийскую железную дорогу. Как исследователь он пересек материк пешком и знал проблемы такой дороги."
1557 = "Джеймс Фиск"
1558 = "«Большой Джим» жил, не заботясь о репутации. Вместе с Дж. Гулдом пытался скупить весь рынок золота. Начавшаяся паника вызвала биржевой крах 1869 года в США - «Черную пятницу»."
1559 = "Сэр Сэнфорд Флеминг"
1560 = "Изыскал трассу Canadian Pacific Railway. Считался хорошим инженером и неутомимым тружеником."
1561 = "Джон К. Фремонт"
1562 = "Разбогател, когда на его земле в Калифорнии нашли золото. Фремонт был исследователем и сторонником центрального пути к Тихому океану вдоль тропы Санта-Фе."
1563 = "Джей Гулд"
1564 = "Начал спекулировать железными дорогами в 21 год. Вместе с Фиском пытался скупить рынок золота, что вызвало крах 1869 года, известный как Черная пятница."
1565 = "Адольф фон Хансеман"
1566 = "Соучредитель Румынской железнодорожной компании, реорганизация которой в конце 1800-х спасла состояния многих европейских аристократов."
1567 = "Эдвард Генри Гарриман"
1568 = "Агрессивный железнодорожный магнат, осужденный в 1907 году Комиссией по торговле между штатами за методы ведения дел. Был заклятым соперником Джеймса Хилла."
1569 = "Джеймс Хилл"
1570 = "Близкий друг Дж. П. Моргана и расчетливый инвестор. Его борьба с Гарриманом за Chicago, Burlington and Quincy Railroad вызвала финансовую панику 1901 года."
1571 = "Сэр Фрэнсис Хинкс"
1572 = "Член канадского правительства в 1800-х, Хинкс помог основать Nova Scotia Railway в 1854 году."
1573 = "Сайрус К. Холлидей"
1574 = "Целеустремленный предприниматель, основал Santa Fe Railway в 1869 году. Также помог основать город Топика, штат Канзас."
1575 = "Марк Хопкинс"
1576 = "Член «Большой четверки» Central Pacific RR, Хопкинс был финансовым скрягой и слыл «упрямейшим человеком на свете»."
1577 = "Коллис Хантингтон"
1578 = "Еще один из «Большой четверки» CPR, Хантингтон известен как «Великий убеждатель»: он ограничивал конкуренцию и выжимал деньги из правительства США."
1579 = "Дж. П. Морган"
1580 = "Специализировался на создании огромных объединений компаний: часто это лишало людей работы, но повышало эффективность. Создал гигантскую U.S. Steel Corporation."
1581 = "Георг Платнер"
1582 = "Платнер создал первую немецкую железную дорогу Нюрнберг - Фюрт в 1833 году. Англичанин Уильям Уилсон стал настоящей знаменитостью как первый машинист этой линии."
1583 = "Сесил Родс"
1584 = "Сын английского проповедника. Разбогател на первых южноафриканских алмазных копях. Позже пытался построить дорогу от Кейптауна до Каира. Родс умер в 1902 году, а дорога так и не достроена."
1585 = "Томас Скотт"
1586 = "Хотя Скотт был опытным владельцем Pennsylvania Railroad, он проиграл К. Хантингтону битву за полосу отвода южной трансконтинентальной дороги из-за политических уловок."
1587 = "Лиленд Стэнфорд"
1588 = "Начал юристом в Висконсине, а закончил сенатором и губернатором Калифорнии. Стэнфорд был политической силой «Большой четверки» CPR."
1589 = "Сэр Джордж Стивен"
1590 = "Помогал строить Canadian Pacific Railway. Работал клерком на шерстяной мануфактуре и за 10 лет стал ее мажоритарным акционером."
1591 = "Лорд Страткона"
1592 = "Он же Дональд Смит. Шотландец, переехавший в Канаду, начал карьеру в Компании Гудзонова залива. Позже с Хиллом и Стивеном выкупил обанкротившуюся линию в Миннесоте, ставшую Great Northern."
1593 = "Джордж Ф. Трейн"
1594 = "Слыл бесшабашным инвестором с рукой Мидаса. Когда стройка Union Pacific застопорилась, Трейн построил в Омахе гостиницу, потому что ему не нравилась прежняя. Страстный оратор, его любили слушать."
1595 = "Корнелиус Вандербилт"
1596 = "Начинал с парома на Статен-Айленд. Вандербилт был напористым строителем корпораций. Основал New York Central Railroad и нажил огромную прибыль на первом железнодорожном сообщении Нью-Йорк - Чикаго."
1597 = "Император Мэйдзи"
1598 = "Мэйдзи открыл Японию для индустриализации и привез в страну паровозы. Не желая зависеть от иностранцев, он отправлял многих людей учиться за границу и привозить важные для Японии технологии."
1599 = "Джордж Гудзон"
1600 = "Гудзон разбогател старым способом - унаследовал состояние. Его страсть контролировать все британские железные дороги втянула страну в скандальную пляску вокруг бесполезного железнодорожного финансирования."
1601 = "Наполеон III"
1602 = "Император Франции в середине и конце 1800-х. Ему приписывают значительное расширение французских железных дорог. А еще - некомпетентность: нельзя же иметь все сразу?"
1603 = "Филип Томас"
1604 = "Оставил пост комиссара канала Chesapeake & Ohio, чтобы стать президентом Baltimore & Ohio, первой полностью действующей паровой железной дороги в США."
1605 = "Томас Дюрант"
1606 = "Помешанный на цифрах чудак с манией величия, Дюрант организовал Credit Mobilier of America, чтобы выманить у правительства миллионы. Дело шло так хорошо, что он потерял контроль над ним в пользу политика Оукса Эймса."
1607 = "Джавахарлал Неру"
1608 = "Неру стал первым премьер-министром Индии в 1947 году. Сразу после избрания он начал крупные улучшения промышленной инфраструктуры Индии."
1609 = "Клемент Эттли"
1610 = "Премьер-министр Великобритании в 1945 году. Эттли, наряду со многими другими масштабными переменами, начал национализацию британских железных дорог."
1611 = "Генерал Гэнтаро"
1612 = "Во время имперской экспансии Японии в конце 1800-х Гэнтаро управлял Тайванем. Правление было жестким, но принесло остро необходимую промышленную инфраструктуру."
1613 = "Мао Цзэдун"
1614 = "Мао привел Коммунистическую партию Китая к победе в гражданской войне и объединил Китай. Он начал крупную перестройку промышленности и общества, не всегда удачную. Китай и сегодня выпускает отличные паровозы."
1615 = "Чан Кайши"
1616 = "Объединил Китай под одним правительством в середине 1930-х. Война с Японией и гражданская война оборвали планы Чана по индустриализации Китая."
1617 = "Уильям Уилрайт"
1618 = "Родом из США, Уилрайт искал удачу в Южной Америке. Построил первую железную дорогу Южной Америки в 1848 году и начал Grand Central Argentine Railway."
1619 = "Майнор Китт"
1620 = "Китт создал International Railways of Central America. Всегда начеку, он увидел возможность в выращивании бананов вдоль своих дорог и нажил состояние на производстве фруктов."
