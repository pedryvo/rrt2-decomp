2596 = "В режиме песочницы вы просто строите дороги и пускаете поезда, не обращая внимания на деньги и конкуренцию. По сути, вы играете в большой песочнице и ни с кем не соревнуетесь."
2597 = "В базовой финансовой модели значение фондового рынка сведено к минимуму. Вы можете покупать и продавать акции своей компании, но не можете поглотить другую компанию или быть поглощенным."
2598 = "В продвинутой финансовой модели продажа без покрытия и покупка акций с маржой отключены, но все остальные стороны фондового рынка (включая поглощения, вложения в другие компании и т. д.) работают."
2599 = "В финансовой модели «эксперт» работают все стороны фондового рынка (что может привести к довольно жестоким финансовым ходам - не говорите, что мы вас не предупреждали)."
2600 = "В базовой промышленной модели экономика сильно упрощена. Любая станция примет любой груз (хотя и по несколько меньшей цене, если груз не востребован). Все отрасли производят грузы, даже если им не поставлено то, что нужно промышленности."
2601 = "В продвинутой промышленной модели экономика умеренно сложна. Станция по-прежнему принимает любой груз, но невостребованные грузы оплачиваются вполовину. Отрасли производят грузы, только если им должным образом поставлено то, что нужно промышленности (если что-то нужно)."
2602 = "В промышленной модели «эксперт» экономика работает на полную. Станции платят сущие гроши за грузы, которые им не нужны. Уровень цен влияет на то, сколько станции готовы платить за грузы, даже если те востребованы. Ваша компания может также скупать понравившиеся ей отрасли."
2603 = "Увеличивает или уменьшает доход, получаемый компаниями под управлением людей (то есть вашей) за перевозку грузов. Чем меньше дохода с рейса, тем заметно труднее игра."
2604 = "Увеличивает или уменьшает доход, получаемый компаниями под управлением компьютера за перевозку грузов. Чем меньше дохода с рейса, тем менее прибыльны компьютерные компании и тем меньшую угрозу они представляют."
