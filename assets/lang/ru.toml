2412 = "Кампании пока не подключены. К сожалению, сейчас их можно только посмотреть."
2413 = "Версия"
2420 = "Добро пожаловать в Railroad Tycoon II!\n\nМы рекомендуем прочитать руководство, чтобы получить полную информацию об игре.\n\nМы также знаем, что большинство хочет сразу броситься в бой, ничего не читая, поэтому мы создали небольшое обучение, которое повторяет обучение из руководства, но менее подробное.\n\nЧтобы начать обучение, выберите «Одиночная игра», затем «Загрузить сценарий», затем дважды щелкните «Обучение»."
2421 = "Осмотритесь. Двигать вид карты можно, подводя мышь к краям экрана или щелкая по радару в левом нижнем углу. Поворачивать и масштабировать карту можно кнопками справа внизу.\n\nКогда будете готовы основать железную дорогу, дважды щелкните <Основать новую компанию> в списке внизу по центру экрана."
2422 = "Прежде чем начать, нужно основать компанию.\n\nНажмите на вкладку «Компания» внизу по центру экрана (самая правая вкладка - возможно, она уже выбрана).\n\nЗатем дважды щелкните <Основать новую компанию>."
2423 = "Теперь можно настроить вашу компанию.\n\nНастоятельно советуем дать компании как можно больше денег на старте, сдвинув обе полосы прокрутки до упора вправо.\n\nЗатем назовите компанию, выберите эмблему и нажмите <OK>"
2424 = "Пора прокладывать пути и отправляться в дорогу.\n\nНайдите два перспективных города поблизости друг от друга - мы советуем Слау и Оксфорд к западу от Лондона.\n\nЧтобы проложить путь, выберите кнопку пути слева на экране, затем нажмите левую кнопку мыши и, удерживая ее, протяните от начальной точки до конечной. Вы увидите числа, показывающие стоимость прокладки на данной клетке и уклон (крутизну) участка. (Старайтесь, чтобы уклон был ниже 2%)."
2425 = "Когда путь проложен как нужно, нажмите кнопку прокладки пути еще раз, чтобы выйти из режима прокладки."
2426 = "Теперь нужно поставить станции на обоих концах пути.\n\nНажмите кнопку станции слева на экране и выберите размер станции внизу.\n\nБольшие станции дороже, но собирают грузы с большей площади.\n\nПока вы перемещаете станцию по карте, подсвеченный круг показывает зону, с которой она будет собирать грузы.\n\nПоставьте станцию рядом с путем, чтобы она стала зеленой, и щелкните, чтобы разместить ее."
2427 = "Постройка станции - только начало. Вам, скорее всего, захочется построить несколько вспомогательных зданий, чтобы обслуживать поезда и повысить их эффективность.\n\nДля начала настоятельно советуем водонапорную башню, песочную башню и паровозное депо на главной станции. (Вероятно, на каждой станции они не нужны.)\n\nНажмите <Купить>, затем постройте каждое из зданий.\n\nКогда закончите, нажмите <ВЫХОД>, чтобы вернуться на главный экран, и поставьте вторую станцию."
2428 = "Итак, у вас есть путь и станции - последний важнейший элемент, конечно, поезда. Нажмите кнопку поезда слева, затем купите поезд."
2429 = "На этом экране вы настраиваете поезда и управляете ими.\n\nС двумя станциями маршрут прост, но когда станций станет больше, вам придется выбирать, куда идет каждый поезд, перетаскивая станции с карты справа в список маршрута слева.\n\nВам также нужно выбрать, какие грузы возить. Нажмите переключатель справа вверху, чтобы перейти в режим грузов, затем щелкайте нужные грузы с учетом того, какие грузы есть на станции (они показаны внизу экрана)."
2430 = "Еще несколько замечаний об основном интерфейсе:\n\n- Маленьким ползунком справа на экране меняйте скорость игры (или клавишами «+» и «-» на клавиатуре).\n\n- Нажмите на окно справа внизу, чтобы прокрутить пропущенные сообщения.\n\n- Нажимайте на вкладки внизу, чтобы смотреть станции, поезда, игроков и компании соответственно.\n\n- Нажмите на маленькую стрелку над списком, чтобы развернуть его."
2431 = "Фондовый рынок - место, где удобно превращать большие состояния в малые.\n\nПоскольку вы, скорее всего, вложили все личные деньги в основание компании, на легком уровне вам почти не о чем беспокоиться.\n\nПо мере того как вы будете восстанавливать наличные через дивиденды и жалованье председателя, вы сможете скупать больше собственных акций, вкладываться в конкурентов, продавать их акции без покрытия, покупать с маржой и вообще развлекаться так, как умеют только парни с Уолл-стрит."
2432 = "Сведения о компании\n\nНа этом экране вы следите за судьбой вашей компании и конкурентов.\n\nНесколько ключевых возможностей: в разделе «Обзор» можно сменить управляющего компанией (вашего подчиненного), выбрав другой набор навыков и, возможно, другую цену.\n\nВ разделе «Финансы» можно выпускать акции и облигации и в целом управлять притоком и оттоком финансирования."
2433 = "Сведения об игроке\n\nХорошо, железнодорожные бароны XIX века - не самая красивая компания, но здесь важна не внешность, а деньги.\n\nНа этом экране можно изучить конкурентов (если они есть) и собственную биографию.\n\nЧтобы посмотреть других игроков, нажимайте стрелки влево и вправо в правой нижней части экрана."
2434 = "Если вам не хватает денег, вы можете выпустить акции или облигации на экране компании.\n\nНажмите на вкладку компании внизу экрана, затем дважды щелкните свою компанию, затем перейдите в раздел финансов и выпустите акции или облигации."
2435 = "Вернулись за добавкой?\n\nМы советуем начать кампанию. Первые несколько сценариев относительно просты, и вы освоите игру, чтобы подготовиться к сложным сценариям впереди.\n\nА если вы просто хотите повалять дурака, попробуйте <Одиночная игра> - <Новая карта>, затем нажмите <Параметры> - <Режим песочницы>. Режим песочницы - для чистого баловства: ни денег, ни забот - просто прокладывайте пути и пускайте поезда."
2436 = "В режиме песочницы вы играете не ради денег и ни с кем не соревнуетесь. Просто стройте и наслаждайтесь.\n\nУ вас также появляются новые инструменты. Попробуйте их - это те же инструменты, которыми создаются новые карты в редакторе карт."
2437 = "Когда промышленная модель установлена на «продвинутую» или «эксперт», разные отрасли намного важнее.\n\nЧтобы получить полную цену за грузы, их нужно возить на станцию, где они востребованы.\n\nНапример, везите зерно на любую станцию рядом с пекарней.\n\nПекарня заплатит за зерно надбавку, а затем переработает его в продовольствие, которое можно отвезти в любой город с хорошей выгодой.\n\nНажмите на любое здание на карте, чтобы узнать, что оно поставляет и в чем нуждается."
2438 = "Редактор позволяет изменять игровые карты или создавать собственные.\n\nВ этой демоверсии карты сохранять нельзя, так что в редакторе можно только поэкспериментировать. В полной версии игры вы сможете сохранять карты, обмениваться ими через интернет, загружать новые карты и т. д."
2440 = "Когда поезд проезжает через станцию с водонапорной башней, песочной башней и (или) паровозным депо, у него восстанавливаются уровни воды, песка и обслуживания соответственно, даже если поезд на этой станции не останавливается."
2441 = "Снимок экрана можно сделать в любой момент клавишей <Print Screen>. Он сохранится как файл .PCX в корневой папке RT2."
2442 = "Таможня на станции вдвое сокращает время ожидания на таможне - это полезно, когда вы используете порт или играете в международном сценарии."
2443 = "Нажмите на маленький значок уступки слева от каждого поезда в списке поездов на главном экране, чтобы изменить приоритет этого поезда.\n\nПоезда с более высоким приоритетом заставляют поезда с низким приоритетом останавливаться и пропускать их при встрече."
2444 = "Клавиша Pause ставит игру на паузу.\n\nПри повторном нажатии пауза снимается.\n\nСкоростью игры можно управлять также клавишами «плюс» и «минус»."
2445 = "Если игра у вас работает вяло, нажмите кнопку настроек слева в основном интерфейсе, затем «Графика» и уменьшите некоторые параметры."
2446 = "Если удерживать клавишу Ctrl и щелкнуть левой кнопкой мыши по игровой карте, вид автоматически центрируется на этом месте."
2447 = "Все города со временем растут, если их обслуживать и снабжать ресурсами.\n\nЧем больше вы поставляете, тем быстрее они растут.\n\nЛучше всего снабжаемые города могут вырасти втрое и более от первоначального размера."
2448 = "Если удерживать клавишу Ctrl при нажатии клавиш со стрелками, экран прокручивается быстрее."
