2552 = "Уровень масла у этого поезда. Если масло кончится, расходы на его обслуживание утроятся. Чтобы пополнить, поезд должен проехать через станцию с паровозным депо (необязательно останавливаясь)."
2553 = "Уровень песка у этого поезда. Если песок кончится, поезду будет трудно на подъемах. Чтобы пополнить, поезд должен проехать через станцию с песочной башней (необязательно останавливаясь)."
2554 = "Уровень воды у этого поезда. Если вода у паровоза кончится, он поползет еле-еле. Чтобы пополнить, поезд должен проехать через станцию с водонапорной башней (необязательно останавливаясь)."
2555 = "Увеличение тяги повышает скорость локомотива выше номинальной, но с большим риском поломки. Нажмите и перетащите, чтобы изменить положение тяги."
