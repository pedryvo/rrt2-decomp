2413 = "版本"
2420 = "欢迎来到《铁路大亨 II》！\n\n我们建议您阅读手册，以全面了解游戏的玩法。\n\n我们也知道大多数人都想什么都不读直接上手，所以我们制作了一个小教程，与手册中的教程相呼应，只是没有那么深入和详细。\n\n要开始教程，请选择“单人游戏”，然后选择“载入场景”，再双击“教程”。"
2421 = "四处看看吧。您可以把鼠标移到屏幕边缘，或点击左下角的雷达框来移动地图视角。您可以使用右下角的按钮来旋转或缩放地图。\n\n准备好开始修建铁路后，请双击屏幕底部中央列表框中的 <创办新公司>。"
2422 = "在开始之前，您需要先创办一家公司。\n\n点击屏幕底部中央的“公司”选项卡（最右边的选项卡，可能已被选中）。\n\n然后双击 <创办新公司>。"
2423 = "好的，现在可以设立您的公司了。\n\n强烈建议您将两个滚动条都拖到最右边，让公司起步时拥有尽可能多的资金。\n\n然后给公司命名，选择一个标志，并点击 <确定>"
2424 = "是时候铺设轨道，行动起来了。\n\n找出两座彼此靠近、前景看好的城市，我们建议选择伦敦以西的斯劳和牛津。\n\n要铺设轨道，请选择屏幕左侧的轨道按钮，然后按住鼠标左键，从起点拖动到终点。您会看到一些数字，表示特定方格的铺轨费用和该路段的坡度（陡峭程度）。（尽量让坡度保持在 2% 以下。）"
2425 = "轨道铺成您想要的样子后，再次点击铺轨按钮，即可退出铺轨模式。"
2426 = "现在您需要在轨道两端建造车站。\n\n点击屏幕左侧的车站按钮，并在底部选择车站规模。\n\n车站越大越贵，但吸引货物的范围也越大。\n\n在地图上移动车站时，亮起的圆圈表示车站的吸引范围。\n\n把车站移到轨道旁边，使其变成绿色，然后点击放置。"
2427 = "建好车站只是开始，您可能还想为车站建造一些配套建筑，以便为列车提供服务并提高其效率。\n\n首先，我们强烈建议在主要车站建造水塔、撒沙塔和机车库。（不一定每个车站都需要。）\n\n点击 <购买>，然后逐个建造这些建筑。\n\n完成后，按 <退出> 返回主画面，然后放置您的第二个车站。"
2428 = "好了，您已经有了轨道和车站，最后一个关键要素当然是列车。点击左侧的列车按钮，然后购买一列火车。"
2429 = "使用此画面设置和控制您的列车。\n\n只有两个车站时，路线很简单，但随着车站增多，您需要将车站从右侧地图拖到左侧的路线列表中，来选择每列列车的去向。\n\n您还需要选择运送哪些货物。点击右上角的开关切换到货物模式，然后根据车站可提供的货物（显示在屏幕底部）点击相应的货物。"
2430 = "关于主界面的一些补充说明：\n\n- 使用屏幕右侧的小滑块控制游戏速度（或使用键盘上的“+”和“-”键）。\n\n- 点击右下角的窗口，可回看您错过的消息。\n\n- 点击底部的选项卡，可分别查看车站、列车、玩家和公司。\n\n- 点击列表框上方的小箭头按钮可将其展开。"
2431 = "股市，擅长把大笔财富变成小笔财富。\n\n由于您可能把个人资金全部用来创办了公司，在简单难度下您不必太过担心。\n\n当您开始通过股息和董事长薪水重建现金后，就可以买入更多自己的股票，投资您的竞争对手，卖空他们的股票，以保证金买入，尽情享受只有华尔街那帮人才懂的乐趣。"
2432 = "公司详情\n\n使用此画面监控您的公司和竞争对手的命运。\n\n几个关键功能：在概览部分，您可以更换公司经理（您的下属），选用技能不同、身价可能也不同的人选。\n\n在财务部分，您可以发行股票和债券，并总体控制资金的流入和流出。"
2433 = "玩家详情\n\n好吧，19 世纪的铁路大亨们长得并不怎么英俊，不过这里看重的不是相貌，而是金钱。\n\n您可以使用此画面查看您的竞争对手（如果有的话）和您自己的传记。\n\n要查看其他玩家，请点击画面右下方的左右箭头。"
2434 = "如果您感到资金吃紧，可以在公司画面发行股票或债券。\n\n点击屏幕底部的公司选项卡，然后双击您的公司，再点击财务部分，发行股票或债券。"
2435 = "又回来了？\n\n我们建议您开始战役。前几个场景相对简单，您可以趁机熟练掌握游戏，为后面的高难度场景做好准备。\n\n反之，如果您只想随便玩玩，请尝试 <单人游戏> - <新地图>，然后点击 <选项> - <沙盒模式>。沙盒模式纯粹用来随便玩玩，没有金钱，没有烦恼，只管铺轨道、开火车。"
2436 = "在沙盒模式下，您不是为了赚钱而玩，也没有任何竞争。尽管建造，尽情享受。\n\n您还能获得一些新工具来玩。试试看吧，它们与地图编辑器中创建新地图时使用的工具相同。"
2437 = "当产业模型设置为高级或专家时，不同的产业会重要得多。\n\n为了让货物物尽其值，您需要将它们运到有需求的车站。\n\n例如，把粮食运到任何附近有面包房的车站。\n\n面包房会为粮食支付溢价，然后将其加工成食品，食品可以运到任何城市，赚取丰厚的利润。\n\n您可以点击地图上的任何建筑，了解它供应和需求什么。"
2438 = "编辑器允许您修改游戏地图或创建自己的地图。\n\n在本演示版中，您无法保存地图，因此只能在编辑器里随便玩玩。在完整版游戏中，您将能够保存地图、通过互联网交换地图、下载新地图等。"
2440 = "让列车经过设有水塔、撒沙塔和/或机车库的车站，会分别重置该列车的水量、沙量和维护等级，即使列车实际上并未在该车站停靠。"
2441 = "您可以随时按 <Print Screen> 键截取屏幕。截图将以 .PCX 文件的形式保存在 RT2 的根目录中。"
2442 = "在车站建造海关，可将通关等待时间减半，在使用港口或国际场景时非常有用。"
2443 = "点击主画面列车列表框中每列列车左侧的小让行图标，可更改该列车的优先级。\n\n优先级较高的列车相遇时，会迫使优先级较低的列车停车让行。"
2444 = "按 Pause 键可暂停游戏。\n\n再次按下可恢复游戏。\n\n您也可以使用加号和减号键控制游戏速度。"
2445 = "如果游戏运行得有点卡顿，请点击主界面左侧的设置按钮，然后点击“图形”，并调低一些设置。"
2446 = "按住 Ctrl 键并用鼠标左键点击游戏地图，会自动将游戏视角居中到该位置。"
2447 = "只要获得服务和资源，所有城市都会随着时间增长。\n\n您供应得越多，它们增长得越快。\n\n供应最充足的城市可以增长到原来规模的三倍或更多。"
2448 = "按住 Ctrl 键并使用方向键，可更快地滚动屏幕。"
