1456 = "艾姆斯·奥克斯"
1457 = "奥克斯是马萨诸塞州的国会议员。因在与联合太平洋铁路有关的动产信用公司丑闻中的角色，奥克斯受到谴责。"
1458 = "弗雷德里克·比林斯"
1459 = "1875 至 1881 年间北太平洋铁路的称职经理。比林斯后来将北太平洋铁路的控制权输给了亨利·维拉德，两年后该公司在维拉德手中破产。"
1460 = "尤金·V·德布斯"
1461 = "德布斯于 1893 年创立美国铁路工会，同时也是美国社会党的创始人。他是美国铁路史上一位真正的反英雄。有他站在您这边也许不错。"
1462 = "约翰·沃克·加勒特"
1463 = "将经营不善的巴尔的摩-俄亥俄铁路公司变成了一家强大的企业。1858 年股东接管成功后，他执掌该公司长达 26 年。"
1464 = "罗伯特·格尔维希"
1465 = "格尔维希是一位德国建筑工程师，负责黑森林铁路的建设。事实证明，格尔维希是一位出色的轨道和隧道建造者。"
1466 = "丹尼尔·古奇"
1467 = "1845 年担任大西部铁路总监，帮助在英国推广宽轨铁路。"
1468 = "查尔斯·梅尔维尔·海斯"
1469 = "1895 年被请来改组加拿大大干线铁路的美国人。海斯以冷酷无情的高效而闻名。"
1470 = "约翰斯·霍普金斯"
1471 = "巴尔的摩的成功商人，霍普金斯作为慈善家而广为人们铭记。他还在 1847 年拯救了巴尔的摩-俄亥俄铁路。"
1472 = "西奥多·D·朱达"
1473 = "“疯狂的特德·朱达”是一位铁路远见者。朱达是横贯大陆铁路事业的倡导者，曾达成收购中央太平洋铁路的协议；然而在从尼加拉瓜前往纽约完成交易的途中，朱达染上黄热病去世。"
1474 = "查尔斯·F·梅耶"
1475 = "梅耶在经营铁路时热衷于扩张。幸运的是，他也很擅长此道。"
1476 = "奥斯卡·G·默里"
1477 = "默里被认为是他那个时代最优秀的运输调度者之一。1904 至 1910 年间执掌巴尔的摩-俄亥俄铁路。"
1478 = "乔治·纳盖尔马克斯"
1479 = "比利时版的乔治·普尔曼。创立了国际卧铺车公司，设计的客车行遍欧洲，常出现在东方快车上。"
1480 = "威廉·J·帕尔默"
1481 = "为丹佛和里奥格兰德铁路精心管理了多条成功的煤炭运输线，并推动美国西南部铁路的扩张。"
1482 = "乔治·斯蒂芬森"
1483 = "早期蒸汽机车和铁路事业的主要贡献者。斯蒂芬森自学了读书写字，并于 1814 年造出了他的第一台蒸汽机车。"
1484 = "威廉·斯特朗"
1485 = "以善于网罗业内最优秀的人才而著称。斯特朗是阿奇逊-托皮卡-圣菲铁路严厉而成功的主管。"
1486 = "托马斯·斯旺"
1487 = "早期的路权专家。1848 年从弗吉尼亚州获得特许，以扩大巴尔的摩-俄亥俄铁路的业务。"
1488 = "理查德·特里维西克"
1489 = "1804 年在英国煤溪谷为铁路系统制造了第一台机车。"
1490 = "吉纳里·特威切尔"
1491 = "特威切尔政治人脉深厚，曾经营波士顿-伍斯特铁路和阿奇逊-托皮卡-圣菲铁路，并在 1867 至 1873 年间担任国会议员。"
1492 = "威廉·C·范霍恩"
1493 = "因出色地全面管理加拿大太平洋铁路公司的建设而享有盛誉。"
1494 = "乔治·威斯汀豪斯"
1495 = "发明天才。威斯汀豪斯发明了多种机车安全装置，其中最著名的是安全信号和空气制动器。"
1496 = "罗伊·B·怀特"
1497 = "在二战危机期间接管了巴尔的摩-俄亥俄铁路的运营。那段时期，世界各地铁路的运输需求都被压榨到了极限。"
1498 = "丹尼尔·威拉德"
1499 = "以勤勉和富有创意著称，威拉德最大的特点就是可靠。"
1500 = "阿尔伯特·阿朗佐·罗宾逊"
1501 = "罗宾逊主管阿奇逊-托皮卡-圣菲铁路期间，负责铺设了超过 5000 英里的轨道。罗宾逊以诚实正直而闻名"
1502 = "菲利普·伦道夫"
1503 = "伦道夫于 1935 年创立卧铺车搬运工兄弟会工会。后来在 1957 年成为美国劳联-产联的副主席。"
1504 = "安德鲁·卡内基"
1505 = "生于苏格兰，卡内基曾管理宾夕法尼亚铁路的匹兹堡段，后来成为最早的钢制铁路桥制造商之一。卡内基最为人铭记的是他作为伟大慈善家的身份。"
1506 = "鲁道夫·狄塞尔"
1507 = "狄塞尔发明了后来以他的名字命名的燃油发动机。不幸的是，糟糕的财务往来和不择手段的商人使狄塞尔最终破产。"
1508 = "本·霍拉迪"
1509 = "霍拉迪是美国西部早期最成功的驿马车经营者之一。霍拉迪买下了驿马快信，靠在西部运送邮件和货物发了大财。后来对俄勒冈铁路的错误投资和 1873 年的恐慌使他倾家荡产。"
1510 = "巴特·马斯特森"
1511 = "侦察兵、印第安人战士、野牛猎手和铁路工人，马斯特森是美国西部传奇的缩影。作为道奇城的副警长和保安，马斯特森成了传奇枪手。"
1512 = "亨利·布斯"
1513 = "1829 年利物浦-曼彻斯特铁路的经理。帮助制定了最早的铁路运营规程。"
1514 = "安德烈·沙普隆"
1515 = "这位法国人的工作彻底革新了蒸汽机车的设计。他对现有蒸汽机车的改造使功率大幅提高。他的许多设计被世界各地采用。"
1516 = "托马斯·克兰普顿"
1517 = "克兰普顿设计的机车虽然在他的祖国英国不受欢迎，却在法国和德国大受欢迎，并影响了欧洲大陆数个世纪的设计。"
1518 = "罗伯特·加尔贝博士"
1519 = "1895 至 1917 年间普鲁士国家铁路的杰出铁路工程师。他设计的 P8 型 4-6-0 机车被分发到世界各地。"
1520 = "赫伯特·加勒特"
1521 = "获得了一种独特的铰接式机车的专利，非常适合急弯和高效产生动力。遗憾的是，这些设计从未在美国或欧洲流行，却在许多其他国家得到广泛使用。"
1522 = "亨利·吉法尔"
1523 = "吉法尔发明了一种能提高蒸汽产量的注水器，蒸汽就是动力。"
1524 = "艾伦·麦克纳布"
1525 = "大西部铁路的董事，1830 至 1862 年间的加拿大议员。"
1526 = "乔治·普尔曼"
1527 = "普尔曼豪华车厢公司的创始人。他设计的客厅车厢和卧铺车厢彻底改变了全球铁路的客运服务。"
1528 = "威廉·施密特博士"
1529 = "在普鲁士国家铁路工作期间，施密特博士将过热器引入蒸汽机车领域。这是对蒸汽动力的一次重大全面改进。"
1530 = "恩斯特·西门子"
1531 = "一位杰出的德国发明家，西门子于 1879 年制造了第一辆实用电动车辆，并建成了第一条公共有轨电车线路。"
1532 = "罗伯特·史蒂文斯"
1533 = "一位小有名气的渡轮和汽船设计师。史蒂文斯发明了“T”形钢轨、道钉，并改进了铁路路基铺设技术。"
1534 = "约翰·伍滕"
1535 = "设计了可燃烧无烟煤的“伍滕火箱”。借助这种装置能够燃烧低品质煤炭，为蒸汽机车节省了大量开支。"
1539 = ""
1540 = "该玩家将在游戏开始时随机分配。"
1541 = "奥托·冯·俾斯麦"
1542 = "人称德国“铁血宰相”。在推行国有化之前曾大举投资铁路，随后让政府以一笔可观的价格收购了所有私营铁路。"
1543 = "格尔森·冯·布莱希罗德"
1544 = "俾斯麦的财务顾问。19 世纪 80 年代欧洲最富有的人之一。为德意志帝国国内外的许多铁路组织融资。"
1545 = "伊桑巴德·金德姆·布鲁内尔"
1546 = "他那个时代富于创造力的杰出工程师，眼光宏大。在英国创办了大西部铁路、南威尔士铁路和大东方铁路。"
1547 = "杰伊·库克"
1548 = "深受信赖的银行家和金融家。库克经手了美国内战期间为北方提供资金的联邦贷款。"
1549 = "查尔斯·克罗克"
1550 = "克罗克是中央太平洋铁路“四巨头”中的“长鞭”。克罗克负责监督美国横贯大陆铁路中中央太平洋铁路段的铺设，干的是脏活累活。"
1551 = "亨克尔·冯·东内斯马克"
1552 = "19 世纪 80 年代德国工业界精明能干的贵族。"
1553 = "丹尼尔·德鲁"
1554 = "与菲斯克和古尔德一起发行掺水股票，成功阻止了范德比尔特夺取伊利铁路的控制权。后来他的两位“合伙人”在财务上暗算了他，使他破产。"
1555 = "约翰·福里斯特爵士"
1556 = "1905 年的西澳大利亚州总理，福里斯特是横贯澳大利亚铁路的有力倡导者。作为探险家，他曾徒步横穿整个大陆，深知这样一条铁路将面临的问题。"
1557 = "詹姆斯·菲斯克"
1558 = "“大吉姆”不顾名声地过着自己的生活。与 J·古尔德一起试图垄断黄金市场。随之而来的恐慌引发了 1869 年美国的“黑色星期五”股市崩盘。"
1559 = "桑福德·弗莱明爵士"
1560 = "勘测了加拿大太平洋铁路的路线。被公认为优秀的工程师和不知疲倦的工作者。"
1561 = "约翰·C·弗里蒙特"
1562 = "因他在加利福尼亚的土地上发现了黄金而发家。弗里蒙特是探险家，也是沿圣达菲小道开辟通往太平洋的中部路线的倡导者。"
1563 = "杰伊·古尔德"
1564 = "21 岁起就开始投机铁路。与菲斯克一起试图垄断黄金市场，引发了 1869 年的股市崩盘，即黑色星期五。"
1565 = "阿道夫·冯·汉泽曼"
1566 = "罗马尼亚铁路公司的联合创始人，该公司的重组挽救了 19 世纪末许多欧洲贵族的财富。"
1567 = "爱德华·亨利·哈里曼"
1568 = "一位咄咄逼人的铁路大亨，其经营手段在 1907 年受到州际商务委员会的谴责。哈里曼是詹姆斯·希尔的死对头。"
1569 = "詹姆斯·希尔"
1570 = "J·P·摩根的密友，精明的投资者。他与哈里曼争夺芝加哥-伯灵顿-昆西铁路的斗争引发了 1901 年的金融恐慌。"
1571 = "弗朗西斯·欣克斯爵士"
1572 = "19 世纪的加拿大政府成员，欣克斯在 1854 年帮助创办了新斯科舍铁路。"
1573 = "赛勒斯·K·霍利迪"
1574 = "一位干劲十足的企业家，霍利迪于 1869 年创办了圣达菲铁路。他还帮助建立了堪萨斯州托皮卡市。"
1575 = "马克·霍普金斯"
1576 = "中央太平洋铁路“四巨头”之一，霍普金斯在财务上吝啬无比，常被称为“世上最固执的人”。"
1577 = "科利斯·亨廷顿"
1578 = "中央太平洋铁路的另一位“四巨头”，亨廷顿以“大说客”闻名，善于限制竞争并从美国政府那里榨取资金。"
1579 = "J·P·摩根"
1580 = "摩根专门创建庞大的企业联合体，常常使许多人失业，却改善了公司业绩。创建了巨型的美国钢铁公司。"
1581 = "乔治·普拉特纳"
1582 = "普拉特纳于 1833 年创建了德国第一条铁路，即纽伦堡-菲尔特铁路。英国人威廉·威尔逊作为这条线路的第一位机车司机，成了名人。"
1583 = "塞西尔·罗兹"
1584 = "出生于一位英国牧师家庭。罗兹靠早期南非钻石矿发家。后来他试图修建一条从南非开普敦到埃及开罗的铁路。罗兹于 1902 年去世，这条铁路至今尚未建成。"
1585 = "托马斯·斯科特"
1586 = "尽管是经验丰富的宾夕法尼亚铁路老板，斯科特却因政治手腕，在争夺一条南部横贯大陆铁路的路权之战中输给了 C·亨廷顿。"
1587 = "利兰·斯坦福"
1588 = "起初在威斯康星州当律师，最终成为加利福尼亚州的参议员和州长。斯坦福是中央太平洋铁路“四巨头”中的政治靠山。"
1589 = "乔治·斯蒂芬爵士"
1590 = "协助建造了加拿大太平洋铁路。斯蒂芬曾在一家毛纺公司当职员，十年内成为该公司的大股东。"
1591 = "斯特拉斯科纳勋爵"
1592 = "又名唐纳德·史密斯。从苏格兰移居加拿大，史密斯的第一份职业在哈德逊湾公司。晚年他与希尔和斯蒂芬合作，接管了明尼苏达州一条破产的线路，该线路后来被称为大北方铁路。"
1593 = "乔治·F·特雷恩"
1594 = "被视为点石成金的狂野投资者。联合太平洋铁路施工延误期间，特雷恩因不喜欢奥马哈当地的旅馆，便自己建了一家。他热情奔放，人们爱听他的演讲。"
1595 = "科尼利尔斯·范德比尔特"
1596 = "从创办一条斯塔滕岛渡轮起家。范德比尔特是一位咄咄逼人的企业缔造者。他创办了纽约中央铁路，并从第一条纽约至芝加哥的铁路服务中获得了巨额利润。"
1597 = "明治天皇"
1598 = "明治使日本走向工业化，并将蒸汽机车引入日本。明治不愿在技术工作上依赖西方人，还派遣许多人出国学习并带回对日本重要的技术。"
1599 = "乔治·哈德逊"
1600 = "哈德逊用最老派的方式赚到了钱，那就是继承。哈德逊想控制全英国铁路的狂热，使英国陷入了一场充斥着一文不值的铁路融资的丑闻之舞。哈德逊堪称日后铁路大亨的早期代表人物。"
1601 = "拿破仑三世"
1602 = "19 世纪中后期的法国皇帝。拿破仑三世被认为大大扩展了法国铁路。他也被认为无能，人总不能十全十美吧？"
1603 = "菲利普·托马斯"
1604 = "辞去切萨皮克-俄亥俄运河专员的职务，出任巴尔的摩-俄亥俄铁路的总裁，这是美国第一条全面投入运营的蒸汽铁路。"
1605 = "托马斯·杜兰特"
1606 = "杜兰特是个怀揣宏图大志的数字怪才，他组织了美国动产信用公司，目的是骗取政府数百万美元。这一行动非常成功，以至于他最终把公司的控制权输给了政客奥克斯·埃姆斯。"
1607 = "贾瓦哈拉尔·尼赫鲁"
1608 = "尼赫鲁是 1947 年印度的首任总理。当选后，他立即着手对印度的工业基础设施进行重大改善。"
1609 = "克莱门特·艾德礼"
1610 = "1945 年任英国首相。艾德礼在众多全面变革之中，开启了英国铁路的国有化。"
1611 = "儿玉源太郎将军"
1612 = "19 世纪末日本帝国主义扩张期间，儿玉源太郎治理台湾。虽然统治严酷，但也带来了急需的工业基础设施。"
1613 = "毛泽东"
1614 = "毛泽东领导中国共产党赢得内战胜利，统一了中国。毛泽东对中国的工业和社会结构进行了重大重组，当然并非全都是好的。如今，中国仍在生产优质的蒸汽机车。"
1615 = "蒋介石"
1616 = "1930 年代中期使中国统一于一个政府之下。对日战争的爆发和内战使蒋介石建设工业化中国的计划中途夭折。"
1617 = "威廉·惠尔赖特"
1618 = "生于美国，惠尔赖特到南美洲寻求发财机会。惠尔赖特于 1848 年建成南美洲第一条铁路，并开始修建阿根廷中央大铁路。"
1619 = "迈纳·基思"
1620 = "基思创办了中美洲国际铁路公司。基思始终保持警觉，看到了沿铁路种植香蕉的商机，并靠水果生产发了大财。"
