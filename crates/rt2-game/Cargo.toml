[package]
name = "rt2-game"
description = "The playable Railroad Tycoon II clone: menu, map view and simulation (binary `rrt2`)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

build = "build.rs"

[[bin]]
name = "rrt2"
path = "src/main.rs"

[dependencies]
rt2-formats.workspace = true
rt2-sim.workspace = true
rt2-render = { path = "../rt2-render" }
rt2-ui = { path = "../rt2-ui" }
rt2-audio.workspace = true
winit = "0.30"
wgpu = "30"
pollster = "1"
anyhow.workspace = true
clap.workspace = true
png.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
rfd = "=0.17.2"

# Icon and version metadata of `rrt2.exe` (build.rs, docs/packaging.md). Host-gated: only a
# Windows build machine compiles it (it calls rc.exe / windres).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[lints]
workspace = true
