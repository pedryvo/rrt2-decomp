# Símbolos recuperados de RT2_PLAT.EXE (sha256 510b9e449612e5c6619d0b86cb65c453cefd26370065f1fd77865760d017e474).
# Fonte da verdade da engenharia reversa: as sessões Ghidra via REA são efêmeras, então reaplique
# este arquivo (mcp__rea__set_addresses_names / set_comment) no início de cada sessão.
#
# Formato: uma tabela por endereço.
# [[symbol]]
# addr = "0x401000"          # endereço virtual (base 0x400000)
# name = "pk2_open"          # snake_case; prefixo do subsistema (pk2_, track_, train_, cargo_, ui_, crt_, mss_, smk_, dd_)
# kind = "function"          # function | global | table | string
# comment = "..."            # opcional: o que faz, em uma linha
# spec = "docs/formats/pk2.md"  # opcional: onde está documentado

[[symbol]]
addr = "0x4f0d70"
name = "pk2_fold_char"
kind = "function"
comment = "maiúscula: c-0x20 se a-z ou c>0xEF (fastcall, AL)"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f43c0"
name = "pk2_load_all"
kind = "function"
comment = "enumera .\\data\\*.pk2 em ordem alfabética decrescente e chama pk2_read_directory"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f4c20"
name = "pk2_read_directory"
kind = "function"
comment = "abre um pack e lê o diretório (PK2: u32 count; .PAK: u16 count); fastcall, ECX=caminho"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f4e60"
name = "pk2_has_file"
kind = "function"
comment = "hash do nome e busca em todos os packs; 1 se existe (fastcall, ECX=nome)"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f5070"
name = "pk2_seek_file"
kind = "function"
comment = "primeiro pack com o hash vence; seek no conteúdo (offset+4+12N para PK2)"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f48e0"
name = "pk2_get_item"
kind = "function"
comment = "cache de itens de pack (11 bytes/slot) e criação do objeto por tipo 0/1/2"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f4600"
name = "pk2_shutdown"
kind = "function"
comment = "reporta 'Pack Item leaked', fecha packs"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x465050"
name = "game_init_paths"
kind = "function"
comment = "inicialização; testa .\\DATA\\rt2.PK2 e procura rt2.PAK/CD"

[[symbol]]
addr = "0x51c53d"
name = "crt_open_file"
kind = "function"
comment = "open de arquivo solto (retorna -1 em falha); nome inferido dos usos"

[[symbol]]
addr = "0x57b92c"
name = "pk2_dir_tables"
kind = "table"
comment = "ponteiros para as tabelas de diretório {hash,offset,size}[count], um por pack"

[[symbol]]
addr = "0x57b954"
name = "pk2_dir_counts"
kind = "table"
comment = "nº de entradas por pack"

[[symbol]]
addr = "0x57b904"
name = "pk2_handles"
kind = "table"
