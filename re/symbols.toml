# Símbolos recuperados de RT2_PLAT.EXE (sha256 510b9e449612e5c6619d0b86cb65c453cefd26370065f1fd77865760d017e474).
# Fonte da verdade da engenharia reversa: as sessões Ghidra via REA são efêmeras, então reaplique
# este arquivo (mcp__rea__set_addresses_names / set_comment) no início de cada sessão.
#
# Formato: uma tabela por endereço.
# [[symbol]]
# addr = "0x401000"          # endereço virtual (base 0x400000)
# name = "pk2_open"          # snake_case; prefixo do subsistema (pk2_, track_, train_, cargo_, ui_, crt_, mss_, smk_, dd_)
# kind = "function"          # function | global | table | string
# comment = "..."            # opcional: o que faz, em uma linha
# spec = "docs/formats/pk2.md"  # opcional: onde está documentado

[[symbol]]
addr = "0x4f0d70"
name = "pk2_fold_char"
kind = "function"
comment = "maiúscula: c-0x20 se a-z ou c>0xEF (fastcall, AL)"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f43c0"
name = "pk2_load_all"
kind = "function"
comment = "enumera .\\data\\*.pk2 em ordem alfabética decrescente e chama pk2_read_directory"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f4c20"
name = "pk2_read_directory"
kind = "function"
comment = "abre um pack e lê o diretório (PK2: u32 count; .PAK: u16 count); fastcall, ECX=caminho"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f4e60"
name = "pk2_has_file"
kind = "function"
comment = "hash do nome e busca em todos os packs; 1 se existe (fastcall, ECX=nome)"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f5070"
name = "pk2_seek_file"
kind = "function"
comment = "primeiro pack com o hash vence; seek no conteúdo (offset+4+12N para PK2)"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f48e0"
name = "pk2_get_item"
kind = "function"
comment = "cache de itens de pack (11 bytes/slot) e criação do objeto por tipo 0/1/2"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x4f4600"
name = "pk2_shutdown"
kind = "function"
comment = "reporta 'Pack Item leaked', fecha packs"
spec = "docs/formats/pk2.md"

[[symbol]]
addr = "0x465050"
name = "game_init_paths"
kind = "function"
comment = "inicialização; testa .\\DATA\\rt2.PK2 e procura rt2.PAK/CD"

[[symbol]]
addr = "0x51c53d"
name = "crt_open_file"
kind = "function"
comment = "open de arquivo solto (retorna -1 em falha); nome inferido dos usos"

[[symbol]]
addr = "0x57b92c"
name = "pk2_dir_tables"
kind = "table"
comment = "ponteiros para as tabelas de diretório {hash,offset,size}[count], um por pack"

[[symbol]]
addr = "0x57b954"
name = "pk2_dir_counts"
kind = "table"
comment = "nº de entradas por pack"

[[symbol]]
addr = "0x57b904"
name = "pk2_handles"
kind = "table"
comment = "handles de arquivo por pack"

[[symbol]]
addr = "0x57b97c"
name = "pk2_is_pak"
kind = "table"
comment = "1 se o pack é .PAK (último char 'K'), 0 se PK2"

[[symbol]]
addr = "0x57b9ac"
name = "pk2_pack_count"
kind = "global"
comment = "número de packs carregados"

[[symbol]]
addr = "0x57b9a4"
name = "pk2_item_cache"
kind = "global"
comment = "cache de itens, DAT_0057b9a8 slots de 11 bytes"

[[symbol]]
addr = "0x4f4ba0"
name = "pk2_get_item_type0"
kind = "function"
comment = "thunk: pk2_get_item(0, nome), banco de sprites LAD (.imb)"
spec = "docs/formats/lad.md"

[[symbol]]
addr = "0x4f4bb0"
name = "pk2_get_item_type1"
kind = "function"
comment = "thunk: pk2_get_item(1, nome), banco de paleta PALT%04d.PAL"
spec = "docs/formats/lad.md"

[[symbol]]
addr = "0x4f4bc0"
name = "pk2_get_item_type2"
kind = "function"
comment = "thunk: pk2_get_item(2, nome), fonte (font*.dat; construtor 0x4f24c0, usa copp*.imb)"
spec = "docs/formats/lad.md"

[[symbol]]
addr = "0x4f8b80"
name = "lad_load"
kind = "function"
comment = "carrega banco LAD: u16 N, N registros de 0x44 bytes, grupos (u32 k, u16 cnt, mapa de quadros, imagens de 0x1d bytes + u32 tamanho + dados); se a 1a imagem tem flag bit 1, carrega PALT<registro+4>.PAL e guarda o ponteiro em registro+8"
spec = "docs/formats/lad.md"

[[symbol]]
addr = "0x4f0f80"
name = "lad_get_image"
kind = "function"
comment = "(registro, grupo, quadro): imagem = grupo.imagens[mapa[quadro % k]] (ou imagens[0] se k<2); imagens de 0x1d bytes"
spec = "docs/formats/lad.md"

[[symbol]]
addr = "0x4f8ea0"
name = "palette_new"
kind = "function"
comment = "construtor do item tipo 1 (paleta); chama palette_load"
spec = "docs/formats/lad.md"

[[symbol]]
addr = "0x4f8ed0"
name = "palette_load"
kind = "function"
comment = "lê u32 n, 35 bytes de slots, n*512 bytes XRGB1555; converte para o formato de tela (565/555/LUT 8 bit conforme DAT_0055d228)"
spec = "docs/formats/lad.md"

[[symbol]]
addr = "0x55e5e0"
name = "str_palt_pal_format"
kind = "string"
comment = "\"PALT%04d.PAL\": nome do banco de paleta de um registro LAD"
spec = "docs/formats/lad.md"
