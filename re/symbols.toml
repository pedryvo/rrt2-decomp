comment = "intervalo inclusivo sobre o rand() do CRT (MSVC LCG); fastcall(ECX=lo, EDX=hi); hi<lo devolve lo; usado por audio, UI, particulas e sementes de sessao"
spec = "docs/spec/rng.md"

[[symbol]]
addr = "0x51c12d"
