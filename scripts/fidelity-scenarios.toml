# Cenarios do placar de fidelidade (scripts/fidelity.py, docs/fidelity-status.md).
# `save`: caminho relativo a instalacao do original (somente leitura). Todo cenario roda no
# original com `advance_save.py` (so aceita formato de save; .MP2 funciona copiado como .GAM).
# `days`: lista de dias a avancar; `seed`: semente do RNG do jogo e do CRT (passos de 320 min).
# `preseed` + `clone_from = "source"`: o clone converte o proprio arquivo 0x233C (rt2_sim::convert)
# com o RNG do inicio da carga igual ao do original (map-gam.md 9). `new_game`: inicio de cenario da
# campanha (SET:IDX:GSEED:RSEED, world-tick.md 10; scripts/fidelity.py explica as opcoes).

